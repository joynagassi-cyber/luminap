<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0F0F10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Lumina" />
  <meta name="msapplication-TileColor" content="#FF6B00" />
  <meta name="msapplication-tap-highlight" content="no" />
  <!-- Security headers: X-Frame-Options & co are set by the Nitro global
       middleware (server/middleware/security.ts). A <meta X-Frame-Options>
       is ignored by browsers and only triggers a console warning, so it is
       not duplicated here. X-Content-Type-Options / Referrer-Policy via
       meta remain as a server-less fallback. -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <title>Lumina · Gestion financière</title>
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <!-- Fix « écran noir après le splash » (v1.0.7) : le fond #121212 (identique
       au noir natif du WebView) est forcé sur html/body AVANT tout autre CSS.
       Pourquoi tu voyais un écran noir : si le bundle JS / Ionic / Capacitor
       WebView ne se termine jamais de charger (réseau, PWA figée, crash), le
       contenu React est vide ET le fond de l'app n'a pas encore de valeur
       (tokens CSS non chargés) → le WebView affiche son noir natif. En forçant
       le fond #121212 dès le 1er paint, le résultat visuel est le même que
       l'arrière-plan de l'app (dark par défaut) : plus de flash noir surprise.
       Le mode clair (localStorage lumina-theme-mode = "light") est géré par le
       script de thème ci-dessous — le fond #121212 est seulement un
       défaut de repli, remplacé par les tokens CSS dès qu'ils se chargent.
       PAS de display:flex ici : les pages Ionic (ion-content) sont
       position:fixed plein-écran, un flex sur html/#root casserait tout le
       layout de l'app (BottomNav, modales, FAB). -->
  <style>
    html, body {
      background: #0F0F10 !important;
      margin: 0;
      min-height: 100vh;
    }
    #root {
      min-height: 100vh;
    }
  </style>
  <!-- Préférences existantes appliquées avant le premier paint : data-theme
       identifie l'accent, data-mode le mode résolu (jamais « system »). -->
  <script>
    (function () {
      var themes = ["spirit", "action", "trust", "emerald", "care", "know", "feminine", "tech", "luxury", "violet", "navy"];
      var theme = "navy";
      var mode = "system";
      try {
        var storedTheme = localStorage.getItem("lumina-theme");
        if (themes.indexOf(storedTheme) !== -1) theme = storedTheme;
      } catch (e) { /* stockage indisponible : défaut */ }
      try {
        var storedMode = localStorage.getItem("lumina-theme-mode");
        if (storedMode === "light" || storedMode === "dark" || storedMode === "system") mode = storedMode;
      } catch (e) { /* stockage indisponible : suivre le système */ }
      var resolved = mode;
      if (mode === "system") {
        try {
          resolved = typeof window.matchMedia === "function"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : "dark";
        } catch (e) { resolved = "dark"; }
      }
      var effects = null;
      try {
        var storedEffects = localStorage.getItem("lumina-theme-effects");
        if (storedEffects === "full" || storedEffects === "lite") effects = storedEffects;
      } catch (e) { /* stockage indisponible : détecter l'appareil */ }
      if (!effects) {
        var device = typeof navigator === "undefined" ? {} : navigator;
        var memory = device.deviceMemory;
        var cores = device.hardwareConcurrency;
        var lowMemory = typeof memory === "number" && isFinite(memory) && memory > 0 && memory <= 2;
        var fewCores = typeof cores === "number" && isFinite(cores) && cores > 0 && cores <= 4;
        effects = lowMemory || fewCores ? "lite" : "full";
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.mode = resolved;
      document.documentElement.dataset.effects = effects;
    })();
  </script>
  <!-- Un seul splash dans l'app : la page React /splash (src/pages/Splash.tsx).
       Ici, aucun écran intermédiaire : le fond forcé ci-dessus (identique au
       canvas) couvre le court instant avant le montage React. -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
