<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Lumina" />
  <meta name="msapplication-TileColor" content="#FF6B00" />
  <meta name="msapplication-tap-highlight" content="no" />
  <!-- Security headers: X-Frame-Options & co are set by the Nitro global
       middleware (server/middleware/security.ts). A <meta X-Frame-Options>
       is ignored by browsers and only triggers a console warning, so it is
       not duplicated here. X-Content-Type-Options / Referrer-Policy via
       meta remain as a server-less fallback. -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <title>Lumina · Gestion financière</title>
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <!-- Fix « écran noir après le splash » (v1.0.7) : le fond #121212 (identique
       au noir natif du WebView) est forcé sur html/body AVANT tout autre CSS.
       Pourquoi tu voyais un écran noir : si le bundle JS / Ionic / Capacitor
       WebView ne se termine jamais de charger (réseau, PWA figée, crash), le
       contenu React est vide ET le fond de l'app n'a pas encore de valeur
       (tokens CSS non chargés) → le WebView affiche son noir natif. En forçant
       le fond #121212 dès le 1er paint, le résultat visuel est le même que
       l'arrière-plan de l'app (dark par défaut) : plus de flash noir surprise.
       Le mode clair (localStorage lumina-theme-mode = "light") est géré par le
       script de data-theme ci-dessous — le fond #121212 est seulement un
       défaut de repli, remplacé par les tokens CSS dès qu'ils se chargent.
       PAS de display:flex ici : les pages Ionic (ion-content) sont
       position:fixed plein-écran, un flex sur html/#root casserait tout le
       layout de l'app (BottomNav, modales, FAB). -->
  <style>
    html, body {
      background: #121212 !important;
      margin: 0;
      min-height: 100vh;
    }
    #root {
      min-height: 100vh;
    }
  </style>
  <!-- Pose data-theme AVANT le premier paint (sombre par défaut) : les
       tokens de src/App.css et les vars Ionic (theme.css) suivent cette
       valeur dès le chargement, sans flash. Le choix est persisté par
       applyThemeMode (src/ionic/themes.ts, localStorage `lumina-theme-mode`). -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("lumina-theme-mode");
        document.documentElement.dataset.theme = mode === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <div id="root">
    <!-- Splash statique (HTML/CSS natif, pas React) : visible immédiatement
         au chargement du document, avant que le bundle JS ne s'exécute.
         Deux variantes (light/dark) — la bonne est révélée par le script
         inline de data-theme ci-dessus (localStorage lumina-theme-mode).
         Le splash React (src/pages/Splash.tsx, route /splash) prend le
         relais quand React monte : même logo, même design system,
         aucune cassure visuelle entre les deux. -->
    <div class="splash-splash-html" aria-hidden="true">
      <div class="splash-splash-html-logo">
        <img src="/lumina-logo-version-monochrome.png" alt="" width="160" height="160" />
        <p class="splash-splash-html-name">Lumina</p>
        <p class="splash-splash-html-sub">Une gestion complète, une foi partagée.</p>
      </div>
    </div>
    <!-- ══════════════════════════════════════════════════════════════════
         Récupération de démarrage — dernier recours, HORS du bundle.

         Ce script est volontairement inline dans index.html : c'est le seul
         code qui s'exécute même quand l'évaluation du bundle échoue. Pourquoi
         c'est indispensable (défaut corrigé le 2026-10-28) :

         `bootWatchdog.ts` est armé par une instruction de `main.tsx`. Or les
         imports ES sont évalués AVANT toute instruction du module. Si un import
         du graphe lève à l'évaluation (ex. `@/lib/auth` sans
         `VITE_SUPABASE_URL`), le corps de `main.tsx` ne s'exécute JAMAIS :
         `armBootWatchdog()` et `createRoot().render()` ne sont jamais atteints.
         Le watchdog ne pouvait donc pas protéger le cas qu'il visait — le même
         défaut que son propre commentaire décrit, un niveau plus haut.

         Ancien comportement de cet endroit du fichier : au bout de 6 s, le
         splash était masqué sans condition (`display:none`). Comme React
         n'avait rien monté, `#root` était vide et le fond `#121212` restait
         seul → « splash puis page noire ». C'était le symptôme exact.

         Nouveau comportement : si l'app n'est pas prête, on n'efface plus
         l'écran, on AFFICHE la raison (message d'erreur capturé) et un bouton
         de rechargement.
         ══════════════════════════════════════════════════════════════════ -->
    <script>
      (function () {
        var OVERLAY_ID = "lumina-boot-recovery";
        var READY_DELAY_MS = 6000;
        var bootError = null;

        // « Prête » = main.tsx a posé `is-hydrated` (rendu React appelé) OU
        // AppReadyBridge a posé `data-app-ready` (coquille montée).
        function appIsReady() {
          var root = document.getElementById("root");
          return !!(
            root &&
            (root.classList.contains("is-hydrated") ||
              root.hasAttribute("data-app-ready"))
          );
        }

        function removeOverlay() {
          var el = document.getElementById(OVERLAY_ID);
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }

        function showOverlay(message) {
          // Idempotent : le watchdog du bundle (12 s) ne peut pas se superposer.
          if (document.getElementById(OVERLAY_ID)) return;

          var el = document.createElement("div");
          el.id = OVERLAY_ID;
          el.setAttribute("data-screen-state", "error");
          el.setAttribute("role", "alert");
          el.style.cssText =
            "position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;" +
            "align-items:center;justify-content:center;gap:10px;padding:24px;" +
            "text-align:center;background:#121212;color:#fff;" +
            "font-family:system-ui,-apple-system,'Segoe UI',sans-serif";

          var title = document.createElement("p");
          title.style.cssText = "margin:0;font-weight:700;font-size:18px";
          title.textContent = "L'application n'a pas pu démarrer";

          var detail = document.createElement("p");
          detail.style.cssText =
            "margin:0;font-size:13px;opacity:.75;max-width:34em;line-height:1.5;word-break:break-word";
          detail.textContent = message || "Le chargement a échoué.";

          var hint = document.createElement("p");
          hint.style.cssText =
            "margin:0;font-size:12px;opacity:.5;max-width:34em;line-height:1.5";
          hint.textContent =
            "Si le message parle de VITE_SUPABASE_URL ou VITE_POWERSYNC_URL, " +
            "le fichier .env est absent ou incomplet (voir .env.example).";

          var btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = "Recharger l'application";
          btn.style.cssText =
            "margin-top:6px;padding:12px 28px;border:0;border-radius:9999px;" +
            "font-weight:600;cursor:pointer;background:#ff6b00;color:#fff";
          btn.addEventListener("click", function () {
            window.location.reload();
          });

          el.appendChild(title);
          el.appendChild(detail);
          el.appendChild(hint);
          el.appendChild(btn);
          // Sur <body>, jamais dans #root : React vide ses enfants au montage
          // et emporterait la surcouche avec eux.
          document.body.appendChild(el);
        }

        // 1. Capturer la vraie cause. Une erreur d'évaluation de module
        //    déclenche un événement `error` sur window : c'est exactement le
        //    message qu'on veut afficher (`[auth] VITE_SUPABASE_URL …`).
        window.addEventListener(
          "error",
          function (e) {
            var msg = e && (e.message || (e.error && e.error.message));
            if (msg) bootError = msg;
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          var msg = r && (r.message || String(r));
          if (msg) bootError = msg;
        });

        // 2. Délai dépassé sans montage → diagnostic, PAS un écran noir.
        setTimeout(function () {
          if (appIsReady()) return;
          var splash = document.querySelector(".splash-splash-html");
          if (splash) splash.style.display = "none";
          showOverlay(
            bootError ||
              "Le démarrage a dépassé " +
                READY_DELAY_MS / 1000 +
                " s. Cause probable : erreur de configuration, bundle bloqué, ou réseau indisponible.",
          );
        }, READY_DELAY_MS);

        // 3. Si l'app finit par démarrer (réseau lent), on retire la surcouche.
        var poll = setInterval(function () {
          if (appIsReady()) {
            removeOverlay();
            clearInterval(poll);
          }
        }, 500);
      })();
    </script>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
