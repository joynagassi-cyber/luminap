name: Android Debug Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

# L'étape « Comment with APK link » publie un commentaire sur la PR ; sans
# `pull-requests: write`, le GITHUB_TOKEN par défaut (lecture seule) renvoie
# 403 « Resource not accessible by integration » et le job échoue APRÈS un
# build réussi (R90 résiduel).
permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create .env.local
        # Les `import.meta.env.VITE_*` sont inlinés au BUILD. Sans ce fichier,
        # le bundle embarque `undefined` → l'app native plante au boot
        # (auth Supabase). Les workflows web (ci/cypress) le créent déjà.
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env.local
          echo "VITE_SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL }}" >> .env.local
          echo "VITE_POWERSYNC_URL=${{ secrets.POWERSYNC_URL }}" >> .env.local
          echo "VITE_ONESIGNAL_APP_ID=${{ secrets.OS_V2_API_KEY || secrets.VITE_ONESIGNAL_APP_ID }}" >> .env.local
          echo "VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN || secrets.VITE_SENTRY_DSN }}" >> .env.local

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app + sync Capacitor
        # Preflight : build:cap, puis cap sync android (recopie dist/ dans
        # le webview — garantit qu'un dist périmé ne peut pas s'embarquer).
        # Sentry : DSN public + upload des source maps (le token active le
        # plugin dans vite.config.ts ; absent → plugin désactivé, build OK).
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm run sync:cap

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Comment with APK link
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📱 Debug APK built successfully!\n\n[Download APK](${artifactUrl})\n\nTo download: Go to Actions → Run → Download artifact`
            });
