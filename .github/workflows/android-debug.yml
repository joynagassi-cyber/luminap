name: Android Debug Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm run build:cap

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./android/gradlew assembleDebug
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Comment with APK link
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📱 Debug APK built successfully!\n\n[Download APK](${artifactUrl})\n\nTo download: Go to Actions → Run → Download artifact`
            });
