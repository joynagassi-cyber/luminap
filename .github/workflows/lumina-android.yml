name: Lumina Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        type: string
        default: '1.0.0'
      make_release:
        description: "Créer une GitHub Release avec l'APK signée"
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  PNPM_VERSION: '11.27.1'

jobs:
  # ---------------------------------------------------------------
  # BUILD DEBUG — à chaque push sur main : APK debug compilé + signé
  # automatiquement par Gradle (debug.keystore), téléchargeable dans
  # les artifacts du run. Utile pour tester la plateforme en sideload.
  # ---------------------------------------------------------------
  debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm run build:cap

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Align Gradle (restore repo versions + namespace + OneSignal + Cordova purge)
        # Le cap sync régénère les fichiers Gradle du projet avec des valeurs
        # incompatibles avec le wrapper Gradle 8.2.1 / AGP 8.2.1 (AGP 8.13.0
        # par défaut, compileSdk 36). On restaure strictement les versions
        # commitées du repo, qui sont déjà alignées :
        # - android/variables.gradle (AGP 8.2.1, SDK 34, Java 17, minSdk 21)
        # Le build.gradle du plugin cordova est généré par cap sync (ignoré
        # par git) — on l'aligne par sed : AGP 8.13.0 → 8.2.1, SDK 36 → 34.
        run: |
          if [ -d "$HOME/.gradle" ]; then
            echo "Purging ~/.gradle"
            rm -rf "$HOME/.gradle"
          fi
          # 1. Restaure variables.gradle à sa version commitée
          git checkout -- android/variables.gradle
          echo "Restauré variables.gradle (AGP 8.2.1 / SDK 34 / Java 17 / minSdk 21)"
          # 2. Align le build.gradle du plugin cordova généré par cap sync
          # (AGP 8.13.0 + SDK 36 par défaut — incompatibles avec le
          #  wrapper Gradle 8.2.1 du projet)
          sed -i "s/com.android.tools.build:gradle:8.13.0/com.android.tools.build:gradle:8.2.1/g" \
            android/capacitor-cordova-android-plugins/build.gradle
          sed -i "s/compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36/compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34/g" \
            android/capacitor-cordova-android-plugins/build.gradle
          # 2a. Purge de la dépendance Cordova framework (impose minSdk 22,
          #  bloquerait le minSdk 21 voulu). Aucun plugin Cordova n'est
          #  installé — les 5 plugins sont natifs Capacitor.
          # Format cap sync vérifié : "    implementation "org.apache.cordova:framework:$cordovaAndroidVersion""
          if grep -q 'implementation "org.apache.cordova:framework:' android/capacitor-cordova-android-plugins/build.gradle; then
            echo "framework Cordova détecté — purge"
            sed -i '/implementation "org.apache.cordova:framework:/d' \
              android/capacitor-cordova-android-plugins/build.gradle
          else
            echo "framework Cordova déjà absent (plugin purgé)"
          fi
          # Vérification : le manifest app doit contenir l'override minSdk
          # 21 (com.onesignal + org.apache.cordova résiduel).
          if ! grep -q 'tools:overrideLibrary="com.onesignal,org.apache.cordova"' \
            android/app/src/main/AndroidManifest.xml; then
            echo "::error::tools:overrideLibrary manquant dans le manifest app (commité) — re-committer android/app/src/main/AndroidManifest.xml."
            exit 1
          fi
          echo "Manifest override OK"
          # 2a-bis. Le manifest app (commité) contient :
          #   <uses-sdk tools:overrideLibrary="com.onesignal,org.apache.cordova" />
          # qui force le minSdk 21 malgré le AAR OneSignal / framework Cordova
          #  résiduel (minSdk 22). Vérifié ci-dessous ; rien à régénérer.
          echo "Aligné cordova plugins build.gradle (AGP 8.2.1 / SDK 34 / sans framework Cordova)"
          # 2b. Même alignement SDK 34 sur variables.gradle (au cas où cap sync
          # l'a régénéré en 36)
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/' android/variables.gradle
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/' android/variables.gradle
          # Patch namespace au plugin storage v1.2.5 (sans namespace dans le
          # build.gradle, cap sync génère une erreur « Namespace not specified »)
          if ! grep -q "^    namespace " node_modules/@capacitor/storage/android/build.gradle; then
            sed -i '/^android {/a\    namespace "com.capacitorjs.plugins.storage"' \
              node_modules/@capacitor/storage/android/build.gradle
          fi
          # Purge des références au plugin Cordova OneSignal non résolu
          # (com.onesignal.cordova.OneSignalPush) qui casse compileJavaWithJavac.
          # Le support OneSignal est natif via @capacitor/push-notifications.
          if grep -rq "com.onesignal.cordova.OneSignalPush" \
            android/capacitor-cordova-android-plugins/ 2>/dev/null; then
            echo "OneSignalPush references détectées — purge"
            find android/capacitor-cordova-android-plugins -name "*.gradle" \
              -exec sed -i '/com.onesignal.cordova.OneSignalPush/d' {} \;
          fi
          echo "Gradle aligné : AGP 8.2.1 + SDK 34 + Java 17 + minSdk 21 + sans framework Cordova"

      - name: Build debug APK
        # Le retry couvre une éventuelle course résiduelle, mais le
        # build doit s'appuyer sur le cache purgé ci-dessus.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          retry_wait_seconds: 30
          retry_on: error
          max_attempts: 3
          command: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ---------------------------------------------------------------
  # BUILD RELEASE — uniquement sur workflow_dispatch (bouton Run
  # workflow) : APK release SANS signature (signé par défaut via
  # lumina-keystore.jks dans android/app/build.gradle), puis signé
  # avec le keystore du repo et poussé en GitHub Release si demandé.
  # ---------------------------------------------------------------
  release-apk:
    name: Build & Sign Release APK
    needs: debug-apk
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm run build:cap

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Align Gradle (restore variables.gradle + AGP 8.2.1 + namespace + Cordova purge)
        # Même étape que le job debug : le plugin cordova est
        # régénéré par cap sync et doit être aligné avant chaque build.
        run: |
          if [ -d "$HOME/.gradle" ]; then
            echo "Purging ~/.gradle"
            rm -rf "$HOME/.gradle"
          fi
          # 1. Restaure variables.gradle à sa version commitée
          git checkout -- android/variables.gradle
          # 2. Force AGP 8.2.1 + SDK 34 sur le build.gradle du plugin cordova
          # (généré par cap sync avec AGP 8.13.0 / SDK 36 par défaut)
          sed -i "s/com.android.tools.build:gradle:8.13.0/com.android.tools.build:gradle:8.2.1/g" \
            android/capacitor-cordova-android-plugins/build.gradle
          sed -i "s/compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36/compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34/g" \
            android/capacitor-cordova-android-plugins/build.gradle
          # 2a. Purge de la dépendance Cordova framework (impose minSdk 22,
          #  bloquerait le minSdk 21 voulu). Aucun plugin Cordova n'est
          #  installé — les 5 plugins sont natifs Capacitor.
          # Format cap sync vérifié : "    implementation "org.apache.cordova:framework:$cordovaAndroidVersion""
          if grep -q 'implementation "org.apache.cordova:framework:' android/capacitor-cordova-android-plugins/build.gradle; then
            echo "framework Cordova détecté — purge"
            sed -i '/implementation "org.apache.cordova:framework:/d' \
              android/capacitor-cordova-android-plugins/build.gradle
          else
            echo "framework Cordova déjà absent (plugin purgé)"
          fi
          # Vérification : le manifest app doit contenir l'override minSdk
          # 21 (com.onesignal + org.apache.cordova résiduel).
          if ! grep -q 'tools:overrideLibrary="com.onesignal,org.apache.cordova"' \
            android/app/src/main/AndroidManifest.xml; then
            echo "::error::tools:overrideLibrary manquant dans le manifest app (commité) — re-committer android/app/src/main/AndroidManifest.xml."
            exit 1
          fi
          echo "Manifest override OK"
          # 2a-bis. Le manifest app (commité) contient :
          #   <uses-sdk tools:overrideLibrary="com.onesignal,org.apache.cordova" />
          # qui force le minSdk 21 malgré le AAR OneSignal / framework Cordova
          #  résiduel (minSdk 22). Vérifié ci-dessous ; rien à régénérer.
          # 2b. Même alignement SDK 34 sur variables.gradle (au cas où cap sync
          # l'a régénéré en 36)
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/' android/variables.gradle
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/' android/variables.gradle
          # 3. Ajoute namespace au plugin storage (v1.2.5, très ancien)
          if ! grep -q "^    namespace " node_modules/@capacitor/storage/android/build.gradle; then
            sed -i '/^android {/a\    namespace "com.capacitorjs.plugins.storage"' \
              node_modules/@capacitor/storage/android/build.gradle
          fi
          # 4. Retire les références au plugin Cordova OneSignal non
          # résolu (com.onesignal.cordova.OneSignalPush) qui casse
          # compileJavaWithJavac. Le support OneSignal est natif via
          # @capacitor/push-notifications (cf. src/lib/notifications).
          if grep -rq "com.onesignal.cordova.OneSignalPush" \
            android/capacitor-cordova-android-plugins/ 2>/dev/null; then
            echo "OneSignalPush references détectées — purge"
            find android/capacitor-cordova-android-plugins -name "*.gradle" \
              -exec sed -i '/com.onesignal.cordova.OneSignalPush/d' {} \;
          fi
          echo "Gradle aligné : AGP 8.2.1 + SDK 34 + minSdk 21 + sans framework Cordova"

      - name: Build release APK
        # Retry : couvre une éventuelle course résiduelle sur le cache
        # classpath après l'alignement.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          retry_wait_seconds: 30
          retry_on: error
          max_attempts: 3
          command: cd android && ./gradlew assembleRelease --no-daemon

      - name: Prepare signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > signing.keystore

      - name: Ensure apksigner is available
        # Sur les runners ubuntu-latest, l'Android SDK sous /usr/local/lib/android
        # ne contient ni build-tools (apksigner) ni cmdline-tools (sdkmanager),
        # ET le runner n'a pas les droits d'écriture dans ce dossier système.
        # Solution : installer cmdline-tools + build-tools;34.0.0 dans
        # $HOME/.android-sdk (accessible en écriture) via sdkmanager.
        # L'étape Sign cherchera dans cette arborescence en priorité.
        run: |
          # 1. apksigner déjà présent dans le SDK système ?
          ANDROID_SDK_ROOT="/usr/local/lib/android"
          if [ ! -d "$ANDROID_SDK_ROOT" ] && [ -n "${ANDROID_HOME:-}" ]; then
            ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          if ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner >/dev/null 2>&1; then
            echo "apksigner déjà présent dans le SDK système — rien à faire"
            exit 0
          fi
          # 2. Installer cmdline-tools + build-tools dans $HOME/.android-sdk
          SDK_HOME="$HOME/.android-sdk"
          if [ -x "$SDK_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools déjà installé dans $SDK_HOME"
          else
            echo "Téléchargement de cmdline-tools..."
            mkdir -p "$SDK_HOME/cmdline-tools" /tmp/cmdtools-dl
            curl -fsSL -o /tmp/cmdtools-dl/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdtools-dl/cmdline-tools.zip -d /tmp/cmdtools-dl
            mv /tmp/cmdtools-dl/cmdline-tools "$SDK_HOME/cmdline-tools/latest"
            rm -rf /tmp/cmdtools-dl
          fi
          echo "Installation de build-tools;34.0.0 (apksigner) dans $SDK_HOME..."
          yes | "$SDK_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_HOME" "build-tools;34.0.0" 2>&1 || true
          if ls "$SDK_HOME"/build-tools/*/apksigner >/dev/null 2>&1; then
            echo "apksigner installé dans $SDK_HOME ✓"
          else
            echo "::error::apksigner non installé — la signature v1+v2+v3 échouera (fallback jarsigner v1)"
            exit 1
          fi

      - name: Sign APK with apksigner
        # L'APK est le build unsigned produit par le Gradle CI
        # (assembleRelease sans signingConfig). Le keystore ci-dessus
        # est restauré depuis le secret ANDROID_KEYSTORE_BASE64.
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK_SRC" ]; then
            # fallback si assembleDebug a un output nommé différemment
            APK_SRC=$(ls android/app/build/outputs/apk/release/app-release-*.apk | head -1)
            echo "Fallback APK source : $APK_SRC"
          fi
          APKSIG=""
          # Reche apksigner dans deux emplacements :
          # 1. $HOME/.android-sdk — installé par l'étape 'Ensure apksigner' (v1+v2+v3)
          # 2. /usr/local/lib/android (ANDROID_HOME) — SDK système du runner
          SDK_ROOT="$HOME/.android-sdk"
          if [ -d "$SDK_ROOT" ]; then
            for bt in "$SDK_ROOT"/build-tools/*/apksigner; do
              if [ -x "$bt" ]; then APKSIG="$bt"; break; fi
            done
          fi
          # Fallback : SDK système
          if [ -z "$APKSIG" ]; then
            for c in /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk /usr/local/android-sdk "${ANDROID_HOME:-}"; do
              [ -z "$c" ] && continue
              [ ! -d "$c" ] && continue
              for bt in "$c"/build-tools/*/apksigner; do
                if [ -x "$bt" ]; then APKSIG="$bt"; break 2; fi
              done
            done
          fi
          # Dernier recours : apksigner sur le PATH global
          if [ -z "$APKSIG" ] && command -v apksigner >/dev/null 2>&1; then
            APKSIG="$(command -v apksigner)"
          fi
          echo "apksigner : ${APKSIG:-non trouvé — fallback jarsigner v1 uniquement}"
          if [ -n "$APKSIG" ]; then
            "$APKSIG" sign \
              --ks signing.keystore \
              --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }} \
              --ks-key-alias ${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out app-release-signed.apk \
              "$APK_SRC"
            echo "Signé avec apksigner (v1+v2+v3 — v1 pour Android < 7.0)"
          else
            echo "apksigner introuvable — fallback jarsigner (v1)"
            ${JAVA_HOME}/bin/jarsigner \
              -keystore signing.keystore \
              -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              -keypass ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }} \
              -signedjar app-release-signed.apk \
              "$APK_SRC" \
              ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          fi

      - name: Verify signature
        run: |
          APKSIG=""
          # Recherche apksigner : $HOME/.android-sdk d'abord (installé par l'étape ci-dessus)
          if [ -d "$HOME/.android-sdk" ]; then
            for bt in "$HOME"/.android-sdk/build-tools/*/apksigner; do
              if [ -x "$bt" ]; then APKSIG="$bt"; break; fi
            done
          fi
          # Fallback : SDK système
          if [ -z "$APKSIG" ]; then
            for c in /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk /usr/local/android-sdk "${ANDROID_HOME:-}"; do
              [ -z "$c" ] && continue
              [ ! -d "$c" ] && continue
              for bt in "$c"/build-tools/*/apksigner; do
                if [ -x "$bt" ]; then APKSIG="$bt"; break 2; fi
              done
            done
          fi
          if [ -z "$APKSIG" ] && command -v apksigner >/dev/null 2>&1; then
            APKSIG="$(command -v apksigner)"
          fi
          if [ -n "$APKSIG" ]; then
            "$APKSIG" verify --verbose app-release-signed.apk
          else
            ${JAVA_HOME}/bin/jarsigner -verify app-release-signed.apk
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-signed
          path: app-release-signed.apk
          retention-days: 30

  # ---------------------------------------------------------------
  # GITHUB RELEASE — seulement si make_release == true : pousse
  # l'APK signé sur la release v<version> (tag v<version>).
  # ---------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: [release-apk]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.make_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: lumina-release-signed

      - name: Rename APK
        run: |
          mv app-release-signed.apk "lumina-v${{ inputs.version || '1.0.0' }}-android.apk"
          ls -la

      - name: Create or update GitHub Release
        # Les runs 35811612186 / 35812457480 / 35813363057 échouent avec
        # "Resource not accessible by integration" (HTTP 403) sur l'API
        # releases — le GITHUB_TOKEN de l'intégration n'a pas le scope
        # release. Un PAT (LUMINA_GITHUB_PAT, scope contents:write) résoud
        # le problème : c'est le token du propriétaire du repo, pas celui
        # du runner.
        # Si le secret LUMINA_GITHUB_PAT n'est pas encore créé, le job échoue
        # avec un message clair → il suffit de le créer dans
        # Settings → Secrets and variables → Actions, scope repo.
        run: |
          if [ -z "${{ secrets.LUMINA_GITHUB_PAT }}" ]; then
            echo "::error::Le secret LUMINA_GITHUB_PAT n'est pas défini."
            echo "Créer un PAT (scope contents:write pour ce repo) et le"
            echo "stocker dans Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          VERSION="${{ inputs.version || '1.0.0' }}"
          TAG="v${VERSION}"
          FILE="lumina-v${VERSION}-android.apk"
          if gh release create "$TAG" \
            --title "Lumina ${VERSION}" \
            --notes "Lumina v${VERSION} — APK Android signé (v2+v3, keystore MFE-JC)." \
            --target main \
            "$FILE" 2>/dev/null; then
            echo "Release ${TAG} créée avec l'APK ${FILE}."
          else
            echo "Release ${TAG} existe déjà — upload de l'APK (clobber)."
            gh release upload "$TAG" "$FILE" --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.LUMINA_GITHUB_PAT }}
