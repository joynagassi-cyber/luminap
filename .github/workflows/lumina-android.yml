name: Lumina Android

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  PNPM_VERSION: '11'

# Ce workflow ne fait plus que le build **debug** sur chaque push main
# (utile pour tester la plateforme en sideload). Le job de release
# (APK signé + GitHub Release) a été **retiré** ici le 2026-10-18 pour
# n'avoir qu'UN seul workflow de release (`release.yml`) — la
# duplication (2 signatures du même APK, 2 releases concurrentes)
# était source de confusion. Pour une release signée :
#   git tag v<version> && git push origin main v<version>
# → trigger du workflow `release.yml` (single source of truth).

jobs:
  debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app + sync Capacitor
        # Preflight : build:cap, puis cap sync android (recopie dist/
        # dans le webview — garantit qu'un dist périmé ne peut pas
        # s'embarquer).
        run: pnpm run sync:cap

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Patch Cordova Sub-project (fix bcprov-jdk18on-1.79.jar)
        # MÊME logique que le step "Patch Cordova Sub-project" de
        # release.yml (job prepare). Le sous-projet
        # `:capacitor-cordova-android-plugins` est GÉNÉRÉ par `cap sync`
        # (fichier gitignored, donc recréé à chaque run CI) et son
        # `build.gradle` déclare `classpath AGP 8.13.0` qui tire
        # transitivement `bcprov-jdk18on-1.79.jar` (via
        # `com.android.tools.build:builder:8.13.0` →
        # `org.bouncycastle:bcprov-jdk18on:1.79`, confirmé dans
        # `~/.gradle/caches/modules-2/metadata` local) — ce JAR échoue
        # à se relier par le classloader de compilation Gradle sur les
        # runners GitHub → erreur "Failed to create Jar file ...
        # bcprov-jdk18on-1.79.jar".
        #
        # Fix : on retire le bloc `buildscript { ... }` du sous-projet
        # (il hérite de l'AGP 8.2.1 de la racine, `android/build.gradle`
        # ligne 10, qui ne tire PAS bcprov 1.79). Fiable car fait APRÈS
        # `cap sync` (le fichier est récréé ici), en Python (plus
        # robuste que sed pour un bloc multi-lignes).
        run: |
          # 2026-10-19 (état final, revert de l'over-patching 3-scopes
          # — cf. run 39185310876 qui a prouvé que le cache Gradle
          # n'était PAS le problème, et le commit 2686e4b qui a
          # nettoyé `android/build.gradle`). Le vrai fix tient en 3
          # briques simples, déjà en place :
          #   1. piquage OneSignal à 4.9.7 (android/app/build.gradle,
          #      commit 4f0c16d) — retire la transitive
          #      `bcprov-jdk18on:1.79` portée par le range 5.x/6.x.
          #   2. downgrade `@capacitor/preferences` 8.0.1 → 6.0.4
          #      (package.json, commit 3382a02) — retire le
          #      `buildscript AGP 8.13.0` de ce plugin spécifiquement.
          #   3. ce step — retire le `classpath AGP 8.13.0` restant
          #      dans les AUTRES plugins Capacitor (grep + sed
          #      idempotent, s'exécute APRÈS `pnpm install` qui a
          #      re-généré ces fichiers).
          echo "Fix bcprov : retrait du classpath AGP 8.13.0 de TOUS les build.gradle plugins Capacitor"
          if grep -Rlq "com.android.tools.build:gradle:8.13.0" node_modules/.pnpm 2>/dev/null; then
            grep -Rl "com.android.tools.build:gradle:8.13.0" node_modules/.pnpm 2>/dev/null | \
              xargs -r sed -i "/com.android.tools.build:gradle:8.13.0/d"
          else
            echo "Aucun AGP 8.13.0 résiduel — rien à faire (déjà propre)"
          fi
          # Align SDK 34 + patch namespace plugin storage (même logique
          # que le step ci-dessus de release.yml). Le fichier réel vit dans
          # node_modules/.pnpm (symlinké depuis node_modules/@capacitor/...),
          # on patche le path "vrai" pour que le patch tienne dans
          # node_modules et pas juste sur le symlink.
          sed -i "s/compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36/compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34/g" \
            android/capacitor-cordova-android-plugins/build.gradle
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/' android/variables.gradle
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/' android/variables.gradle
          STORAGE_GRADLE="$(node -e "console.log(require.resolve('@capacitor/storage/android/build.gradle'))" 2>/dev/null || true)"
          if [ -z "$STORAGE_GRADLE" ]; then
            STORAGE_GRADLE="node_modules/@capacitor/storage/android/build.gradle"
          fi
          if [ -f "$STORAGE_GRADLE" ] && ! grep -q "^    namespace " "$STORAGE_GRADLE"; then
            sed -i '/^android {/a\    namespace "com.capacitorjs.plugins.storage"' "$STORAGE_GRADLE"
          fi

      - name: Build debug APK
        # Pas de --no-daemon (le classloader "single-use" du flag
        # échoue à relier le JAR bcprov 1.79 — bug documenté en
        # mémoire gradle-jdk17-bcprov-infra-fail, confirmé 2026-10-18
        # en local : build SANS --no-daemon = OK, AVEC = échec).
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
