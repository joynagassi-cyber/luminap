name: Lumina Android

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  PNPM_VERSION: '11'

# Ce workflow ne fait plus que le build **debug** sur chaque push main
# (utile pour tester la plateforme en sideload). Le job de release
# (APK signé + GitHub Release) a été **retiré** ici le 2026-10-18 pour
# n'avoir qu'UN seul workflow de release (`release.yml`) — la
# duplication (2 signatures du même APK, 2 releases concurrentes)
# était source de confusion. Pour une release signée :
#   git tag v<version> && git push origin main v<version>
# → trigger du workflow `release.yml` (single source of truth).

jobs:
  debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create .env.local
        # Les `import.meta.env.VITE_*` sont inlinés au BUILD. Sans ce fichier,
        # le bundle embarque `undefined` → l'app native plante au boot
        # (auth Supabase). Les workflows web (ci/cypress) le créent déjà.
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env.local
          echo "VITE_SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL }}" >> .env.local
          echo "VITE_POWERSYNC_URL=${{ secrets.POWERSYNC_URL }}" >> .env.local
          echo "VITE_ONESIGNAL_APP_ID=${{ secrets.OS_V2_API_KEY || secrets.VITE_ONESIGNAL_APP_ID }}" >> .env.local
          echo "VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN || secrets.VITE_SENTRY_DSN }}" >> .env.local

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app + sync Capacitor
        # Preflight : build:cap, puis cap sync android (recopie dist/
        # dans le webview — garantit qu'un dist périmé ne peut pas
        # s'embarquer).
        # Sentry : DSN public + upload des source maps (le token active le
        # plugin dans vite.config.ts ; absent → plugin désactivé, build OK).
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm run sync:cap

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      # Capacitor 8 : plus de contournement bcprov. Tous les `@capacitor/*`
      # sont en 8.x et partagent l'AGP 8.13.0 de `android/build.gradle`
      # (l'AGP 8.13.0 n'est plus un artefact fautif à retirer).

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
