name: Lumina Android Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: false
        type: string
        default: '1.0.0'

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  CAPACITOR_APP_ID: 'org.mfejcentrale.lumina'

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Security audit (critical only)
        run: pnpm audit --audit-level=critical

  build:
    name: Build APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm run build:cap
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew
      - name: Build debug APK (retry: classpath jar race)
        # bcprov-jdk18on « Failed to create Jar file » = course d'écriture
        # du cache classpath — retry standard (cf. android-build-cl #2)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          retry_wait_seconds: 30
          retry_on: error
          max_attempts: 3
          command: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Build release APK unsigned (retry: classpath jar race)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          retry_wait_seconds: 30
          retry_on: error
          max_attempts: 3
          command: cd android && ./gradlew assembleRelease --no-daemon
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  sign:
    name: Sign APK
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: lumina-release-unsigned
      - name: Create signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Sign APK with apksigner
        run: |
          ANDROID_SDK_ROOT=/usr/lib/android/sdk
          APKSIG="$ANDROID_SDK_ROOT/build-tools/latest/apksigner"
          if [ ! -f "$APKSIG" ]; then
            echo "apksigner not found, falling back to jarsigner (v1)"
            ${JAVA_HOME}/bin/jarsigner \
              -keystore signing.keystore \
              -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              -keypass ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }} \
              -signedjar app-release-signed.apk \
              app-release-unsigned.apk \
              ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          else
            "$APKSIG" sign \
              --ks signing.keystore \
              --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }} \
              --ks-key-alias ${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out app-release-signed.apk \
              app-release-unsigned.apk
          fi
      - name: Verify signature
        run: |
          ANDROID_SDK_ROOT=/usr/lib/android/sdk
          APKSIG="$ANDROID_SDK_ROOT/build-tools/latest/apksigner"
          if [ -f "$APKSIG" ]; then
            "$APKSIG" verify --verbose app-release-signed.apk
          else
            ${JAVA_HOME}/bin/jarsigner -verify app-release-signed.apk
          fi
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-signed
          path: app-release-signed.apk
          retention-days: 30

  deploy:
    name: Deploy to GitHub Releases
    needs: sign
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: lumina-release-signed
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: Lumina v${{ github.event.inputs.version || '1.0.0' }}
          files: app-release-signed.apk
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
