name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  PNPM_VERSION: '11'

# Un SEUL workflow (release) produit l'APK signé et publie la GitHub Release.
# Le job debug de `lumina-android.yml` (build APK sideload sur push main) est
# indépendant et n'a pas à passer ici. Structure inspirée du pattern
# multi-jobs `prepare → build → sign → release` (cf. release holistique de
# l'équipe, adaptée au cas Android-sidelow-GitHub, sans canary/stable).

jobs:
  # ---------------------------------------------------------------
  # PRÉPARATION : vérifier le tag, installer les deps, patcher le
  # bug bcprov JUSQU'À CE QUE LE BUILD SOIT RELANCÉ.
  # ---------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Create .env.local
        # Les `import.meta.env.VITE_*` sont inlinés au BUILD. Sans ce fichier,
        # le bundle embarque `undefined` → l'app native plante au boot
        # (auth Supabase). Les workflows web (ci/cypress) le créent déjà.
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env.local
          echo "VITE_SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL }}" >> .env.local
          echo "VITE_POWERSYNC_URL=${{ secrets.POWERSYNC_URL }}" >> .env.local
          echo "VITE_ONESIGNAL_APP_ID=${{ secrets.OS_V2_API_KEY || secrets.VITE_ONESIGNAL_APP_ID }}" >> .env.local
          echo "VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN || secrets.VITE_SENTRY_DSN }}" >> .env.local

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web + sync Capacitor
        # Régénère dist/ + l'arborescence `android/capacitor-cordova-android-plugins/`.
        # sera PAS recréé tant que le build Gradle n'a pas démarré).
        run: pnpm run sync:cap

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      # Capacitor 8 : plus de contournement bcprov. Tous les `@capacitor/*`
      # sont en 8.x et partagent l'AGP 8.13.0 de `android/build.gradle`.
      # `variables.gradle` porte déjà compileSdk/targetSdk 36.

      - name: Expose version
        id: version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject versionName/versionCode from tag (self-update)
        # CRITIQUE (audit 2026-11-01) : sans ce patch, `versionName` restait
        # FIGÉ à la valeur commitée (1.2.1) quel que soit le tag. L'APK
        # installé et la Release portaient alors la MÊME version → soit la
        # mise à jour n'était jamais détectée, soit `compareVersions` restait
        # > 0 en boucle (l'utilisateur réinstallait sans fin le même APK).
        # `versionCode` doit être STRICTEMENT croissant (Android refuse un
        # downgrade : INSTALL_FAILED_VERSION_DOWNGRADE).
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.APP_VERSION }}"
          IFS='.' read -r MAJ MIN PAT <<< "$VER"
          MAJ="${MAJ:-0}"; MIN="${MIN:-0}"; PAT="${PAT:-0}"
          # Retire tout suffixe non numérique (ex. 1.2.1-rc1 → 1).
          PAT="${PAT%%[!0-9]*}"; MIN="${MIN%%[!0-9]*}"; MAJ="${MAJ%%[!0-9]*}"
          MAJ="${MAJ:-0}"; MIN="${MIN:-0}"; PAT="${PAT:-0}"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          F=android/app/build.gradle
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${CODE}/" "$F"
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${VER}\"/" "$F"
          echo "build.gradle → versionName=${VER}, versionCode=${CODE}"
          # Échec bruyant si le patch n'a pas pris (jamais de panne muette).
          grep -q "versionName \"${VER}\"" "$F" || { echo "::error::versionName non appliqué"; exit 1; }
          grep -q "versionCode ${CODE}" "$F" || { echo "::error::versionCode non appliqué"; exit 1; }
          grep -E "version(Name|Code)" "$F"

      - name: Upload patched android/ tree for the build job
        # Le patch est fait SUR le working tree de CE job (le fichier est
        # gitignored, donc PAS commité). On le pousse en artefact pour que
        # le job "build-android" (qui checkout à zéro) récupère la version
        # PATCHÉE, pas le template `cap sync` neuf.
        uses: actions/upload-artifact@v4
        with:
          name: patched-android-src
          path: |
            android/settings.gradle
            android/variables.gradle
            android/build.gradle
            android/gradle.properties
            android/capacitor-cordova-android-plugins/build.gradle
            android/app/build.gradle
            android/app/src/main/AndroidManifest.xml
          retention-days: 1

  # ---------------------------------------------------------------
  # BUILD : l'APK unsigned (Gradle), sur le source PATCHÉ du job
  # précédent.
  # ---------------------------------------------------------------
  build-android:
    name: Build Android (unsigned APK)
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Create .env.local
        # Les `import.meta.env.VITE_*` sont inlinés au BUILD. Sans ce fichier,
        # le bundle embarque `undefined` → l'app native plante au boot
        # (auth Supabase). Les workflows web (ci/cypress) le créent déjà.
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env.local
          echo "VITE_SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL }}" >> .env.local
          echo "VITE_POWERSYNC_URL=${{ secrets.POWERSYNC_URL }}" >> .env.local
          echo "VITE_ONESIGNAL_APP_ID=${{ secrets.OS_V2_API_KEY || secrets.VITE_ONESIGNAL_APP_ID }}" >> .env.local
          echo "VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN || secrets.VITE_SENTRY_DSN }}" >> .env.local

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web + sync Capacitor
        # Sentry : le DSN public + l'upload des source maps nécessitent les
        # secrets (le token active le plugin dans vite.config.ts). Absents en
        # local : le plugin est désactivé, le build passe.
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm run sync:cap

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      # Même step que dans le job `prepare` (au-dessus, ligne 95),
      # ré-appliqué ICI dans le job `build-android` (qui a sa propre
      # installation `pnpm install --frozen-lockfile` fraîche, qui
      # remet à zéro les fichiers `node_modules/.pnpm/.../android/
      # build.gradle` avant ce step — le patch du job `prepare` ne
      # survit PAS entre les 2 jobs, cf. run 39187053500 qui a échoué
      # pour exactement cette raison : le patch s'est bien exécuté
      # dans `prepare` mais a été re-supplémenté par le `pnpm
      # install` du job `build-android`).
      # Capacitor 8 : les `@capacitor/*` sont en 8.x, alignés sur l'AGP
      # 8.13.0 du projet. Le step de contournement bcprov a été supprimé.

      - name: Restore patched android/ tree (version du job prepare)
        uses: actions/download-artifact@v4
        with:
          name: patched-android-src
          path: android
      # Capacitor 8 : AGP 8.13.0 est désormais l'AGP ATTENDU par le projet
      # (android/build.gradle). Le contournement bcprov-jdk18on:1.79 n'a
      # plus lieu d'être — il retirait le classpath AGP 8.13.0 des plugins
      # pour contourner un conflit de JAR propre à Capacitor 7.

      - name: Build release APK (unsigned)
        # `gradlew assembleRelease` produit `app-release-unsigned.apk`
        # (aucune `signingConfigs.release` active dans le build.gradle,
        # la signature réelle est faite au job "sign-android"). Le
        # daemon Gradle PERSISTANT est utilisé (pas `--no-daemon`).
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 1

  # ---------------------------------------------------------------
  # SIGN : apksigner v1+v2+v3 (keystore du secret ANDROID_KEYSTORE_*).
  # ---------------------------------------------------------------
  sign-android:
    name: Sign APK (apksigner v1+v2+v3)
    runs-on: ubuntu-latest
    needs: [build-android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: lumina-release-unsigned
          path: unsigned

      - name: Decode signing keystore
        # Source unique : le secret `ANDROID_KEYSTORE_BASE64` (créé le
        # 2026-09-06, consommé aussi par `lumina-android.yml` job debug).
        # Ne PAS mélanger les namespaces `LUMINA_KEYSTORE_*` (incomplet,
        # ne doit plus être utilisé — voir MEMORY.md).
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > signing.keystore
          keytool -list -v -keystore signing.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | head -20

      - name: Install apksigner (v1+v2+v3)
        # Sur les runners ubuntu-latest, le SDK du runner ne contient pas
        # build-tools. On installe `build-tools;34.0.0` (fournit
        # `apksigner`) dans `$HOME/.android-sdk` — logique identique au
        # job `debug-apk` de `lumina-android.yml`.
        run: |
          ANDROID_SDK_ROOT="/usr/local/lib/android"
          if [ ! -d "$ANDROID_SDK_ROOT" ] && [ -n "${ANDROID_HOME:-}" ]; then
            ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          if ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner >/dev/null 2>&1; then
            echo "apksigner déjà présent dans le SDK système — rien à faire"
            exit 0
          fi
          SDK_HOME="$HOME/.android-sdk"
          if [ -x "$SDK_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools déjà installé dans $SDK_HOME"
          else
            echo "Téléchargement de cmdline-tools..."
            mkdir -p "$SDK_HOME/cmdline-tools" /tmp/cmdtools-dl
            curl -fsSL -o /tmp/cmdtools-dl/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdtools-dl/cmdline-tools.zip -d /tmp/cmdtools-dl
            mv /tmp/cmdtools-dl/cmdline-tools "$SDK_HOME/cmdline-tools/latest"
            rm -rf /tmp/cmdtools-dl
          fi
          echo "Installation de build-tools;34.0.0 (apksigner) dans $SDK_HOME..."
          yes | "$SDK_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_HOME" "build-tools;34.0.0" 2>&1 || true
          if ls "$SDK_HOME"/build-tools/*/apksigner >/dev/null 2>&1; then
            echo "apksigner installé dans $SDK_HOME ✓"
          else
            echo "::error::apksigner non installé — la signature v1+v2+v3 échouera (fallback jarsigner v1)"
            exit 1
          fi

      - name: Sign APK with apksigner (v1+v2+v3)
        # L'APK est le build unsigned produit par Gradle (assembleRelease
        # sans signingConfig active). Le v1 signing est activé pour
        # couvrir les appareils Android < 7.0 (minSdk 21).
        run: |
          APK_SRC="$(find unsigned -name '*.apk' | head -1)"
          echo "APK source : $APK_SRC"
          APKSIG=""
          SDK_ROOT="$HOME/.android-sdk"
          if [ -d "$SDK_ROOT" ]; then
            for bt in "$SDK_ROOT"/build-tools/*/apksigner; do
              if [ -x "$bt" ]; then APKSIG="$bt"; break; fi
            done
          fi
          if [ -z "$APKSIG" ]; then
            for c in /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk /usr/local/android-sdk "${ANDROID_HOME:-}"; do
              [ -z "$c" ] && continue
              [ ! -d "$c" ] && continue
              for bt in "$c"/build-tools/*/apksigner; do
                if [ -x "$bt" ]; then APKSIG="$bt"; break 2; fi
              done
            done
          fi
          if [ -z "$APKSIG" ] && command -v apksigner >/dev/null 2>&1; then
            APKSIG="$(command -v apksigner)"
          fi
          echo "apksigner : ${APKSIG:-non trouvé — fallback jarsigner v1 uniquement}"
          if [ -n "$APKSIG" ]; then
            "$APKSIG" sign \
              --ks signing.keystore \
              --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }} \
              --ks-key-alias ${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out app-release-signed.apk \
              "$APK_SRC"
            echo "Signé avec apksigner (v1+v2+v3 — v1 pour Android < 7.0)"
          else
            echo "apksigner introuvable — fallback jarsigner (v1 uniquement)"
            ${JAVA_HOME}/bin/jarsigner \
              -keystore signing.keystore \
              -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              -keypass ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }} \
              -signedjar app-release-signed.apk \
              "$APK_SRC" \
              ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          fi

      - name: Verify signature
        run: |
          APKSIG=""
          if [ -d "$HOME/.android-sdk" ]; then
            for bt in "$HOME"/.android-sdk/build-tools/*/apksigner; do
              if [ -x "$bt" ]; then APKSIG="$bt"; break; fi
            done
          fi
          if [ -z "$APKSIG" ]; then
            for c in /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk /usr/local/android-sdk "${ANDROID_HOME:-}"; do
              [ -z "$c" ] && continue
              [ ! -d "$c" ] && continue
              for bt in "$c"/build-tools/*/apksigner; do
                if [ -x "$bt" ]; then APKSIG="$bt"; break 2; fi
              done
            done
          fi
          if [ -z "$APKSIG" ] && command -v apksigner >/dev/null 2>&1; then
            APKSIG="$(command -v apksigner)"
          fi
          if [ -n "$APKSIG" ]; then
            "$APKSIG" verify --verbose app-release-signed.apk
          else
            ${JAVA_HOME}/bin/jarsigner -verify app-release-signed.apk
          fi

      - name: Prepare final assets (APK + SHA-256)
        # Le self-updater (`src/updater/checkForUpdate.ts`) télécharge
        # `app-release.apk` + son hash compagnon `app-release.apk.sha256`
        # (format POSIX `sha256sum`) depuis la GitHub Release. Les 2
        # fichiers sont produits ici, prêts à être poussés au job "release".
        run: |
          mv app-release-signed.apk app-release.apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Upload signed APK + SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-final
          path: |
            app-release.apk
            app-release.apk.sha256
          retention-days: 30

  # ---------------------------------------------------------------
  # RELEASE : pousse l'APK signé + le SHA-256 sur la GitHub Release
  # (celle que le self-updater lit via `releases/latest`).
  # ---------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [sign-android]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download signed APK + SHA-256
        uses: actions/download-artifact@v4
        with:
          name: lumina-release-final
          path: release-assets

      - name: Load release body (if a curated file was committed)
        id: release-body
        run: |
          # Le body de release doit être COMPLET (fonctionnalités livrées,
          # signature, changelog) — pas juste vide/absent. Si un fichier
          # `.github/release-bodies/release-<version>.md` a été commité
          # avant le tag (cf. `scripts/generate-release-body.sh`), on le
          # pousse comme body via cet output ; sinon `softprops/
          # action-gh-release` retombe sur le message du tag (pas assez
          # documenté).
          VER="${GITHUB_REF_NAME#v}"
          BODY_FILE=".github/release-bodies/release-${VER}.md"
          if [ -f "$BODY_FILE" ]; then
            {
              echo "body<<EOF_RELEASE_BODY"
              cat "$BODY_FILE"
              echo "EOF_RELEASE_BODY"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Body de release chargé depuis $BODY_FILE"
          else
            echo "::warning::Aucun $BODY_FILE trouvé — la release ne portera que le message du tag (recommandation : commit-er un body via scripts/generate-release-body.sh avant de tagger)."
          fi

      - name: Create or update GitHub Release
        # `softprops/action-gh-release` crée (ou met à jour) la release
        # sur le tag qui a déclenché ce run (`v<version>`), et pousse
        # les 2 assets (APK signé + hash compagnon) + le body (s'il a
        # été fourni au step ci-dessus, sinon le message du tag). Le
        # token `GITHUB_TOKEN` par défaut du runner a le scope
        # `contents: write` (déclaré en haut du workflow) — aucun PAT
        # requis.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
          body: ${{ steps.release-body.outputs.body }}
          draft: false
          prerelease: false
