name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  PNPM_VERSION: '11'

# Un SEUL workflow (release) produit l'APK signé et publie la GitHub Release.
# Le job debug de `lumina-android.yml` (build APK sideload sur push main) est
# indépendant et n'a pas à passer ici. Structure inspirée du pattern
# multi-jobs `prepare → build → sign → release` (cf. release holistique de
# l'équipe, adaptée au cas Android-sidelow-GitHub, sans canary/stable).

jobs:
  # ---------------------------------------------------------------
  # PRÉPARATION : vérifier le tag, installer les deps, patcher le
  # bug bcprov JUSQU'À CE QUE LE BUILD SOIT RELANCÉ.
  # ---------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web + sync Capacitor
        # Régénère dist/ + l'arborescence `android/capacitor-cordova-android-plugins/`
        # (le buildscript fautif AGP 8.13.0 du sous-projet est récréé ici — on le
        # corrige juste après dans le step "Patch Cordova Sub-project", et il ne
        # sera PAS recréé tant que le build Gradle n'a pas démarré).
        run: pnpm run sync:cap

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Patch Cordova Sub-project (fix bcprov-jdk18on-1.79.jar)
        # Cause racine du bug reproductible "Failed to create Jar file ...
        # bcprov-jdk18on-1.79.jar" (runs 39153873528 → 39173935582, le 18/10) :
        # le sous-projet `:capacitor-cordova-android-plugins` est GÉNÉRÉ par
        # `cap sync` (fichier gitignored, donc **recréé à chaque run CI**), et
        # son `build.gradle` déclare :
        #
        #   buildscript {
        #     dependencies { classpath 'com.android.tools.build:gradle:8.13.0' }
        #   }
        #
        # Ce classpath AGP 8.13.0 tire transitivement `bcprov-jdk18on-1.79.jar`
        # (via `com.android.tools.build:builder:8.13.0` →
        # `org.bouncycastle:bcprov-jdk18on:1.79`, confirmé dans
        # `~/.gradle/caches/modules-2/metadata` local). Ce JAR échoue à se
        # relier par le classloader de compilation Gradle sur les runners GitHub
        # → erreur fatale à la configuration du sous-projet.
        #
        # Les correctifs tentés précédemment (exclure bcprov dans
        # `allprojects.configurations.all`, forcer une version, retirer
        # `--no-daemon`, exclure le sous-projet de `settings.gradle`) ne
        # touchaient PAS cette ligne du `buildscript` du sous-projet, qui est
        # indépendante des configurations du projet principal — c'est pour ça
        # qu'ils n'ont pas marché.
        #
        # Fix définitif : on retire le bloc `buildscript { ... }` du
        # `build.gradle` du sous-projet. Il n'en a pas besoin — le sous-projet
        # hérite de l'AGP de la racine (`com.android.tools.build:gradle:8.2.1`,
        # cf. `android/build.gradle` ligne 10, qui ne tire PAS bcprov 1.79).
        #
        # C'est fait en Python (plus fiable que `sed` pour un bloc multi-lignes)
        # et il s'applique APRÈS `cap sync` (le fichier est re-généré, on
        # patche le contenu FRAIS, pas la version commitée du repo).
        run: |
          # Cause racine du bug bcprov (conclu après 8 runs rouges, cf.
          # runs 39179717688 → 39186507781, le 19/10) : ce N'EST PAS le
          # sous-projet `:capacitor-cordova-android-plugins` (vérifié : SANS
          # buildscript), ce n'est PAS le JDK (17 ET 21 échouent), ce n'est
          # PAS le cache du runner (cache 100% isolé/frais = même échec),
          # et ce n'est PAS OneSignal ni @capacitor/preferences (piquage /
          # downgrade inefficaces).
          #
          # La VRAIE cause : CHAQUE des 8 sous-projets `:capacitor-*`
          # (fichiers `node_modules/.pnpm/.../android/build.gradle` — déjà
          # listés ci-dessus, `grep -Rl "^buildscript {" node_modules/.pnpm
          # = 8 fichiers exactement) porte son PROPRE bloc `buildscript {
          # repositories {...} dependencies { classpath ... } }`. Ce
          # `buildscript {}` est UN SCOPE DE CLASSTPATH TOTALEMENT
          # INDÉPENDANT du `buildscript {}` du projet racine ET du
          # `allprojects.configurations.all` — Gradle n'applique AUCUN
          # `exclude`/`force`/`resolutionStrategy` d'un scope à l'autre.
          # Le classpath de `com.android.tools.build:gradle:8.2.1` (que
          # ces sous-projets `buildscript` classpath DE DÉFINISSONS eux-
          # mêmes, pour `@capacitor/storage` v1.2.5 / `@capacitor/push-
          # notifications` / etc.) tire `bcprov-jdk18on:1.79` (version
          # résolue via la chaîne transitive de ce buildscript
          # ISOLÉ, pas via `allprojects.configurations.all` du projet
          # racine, qui est un tout autre conteneur de résolutions).
          #
          # `android/build.gradle` (le commit 1af9857) s'occupe déjà des 2
          # scopes "racine" (`buildscript.configurations.classpath` +
          # `allprojects.configurations.all`). Le scope MANQUANT — celui
          # qui résout réellement le JAR fautif — est le `buildscript`
          # de CHACUN de ces 8 sous-projets. C'est CE step qui le
          # patche : on injecte un `resolutionStrategy.force` dans le
          # bloc `buildscript { dependencies { ... } }` de CHAQUE fichier,
          # en ajoutant le force juste APRÈS la ligne `dependencies {`
          # qui ouvre ce bloc (le pattern est stable/identique sur les 8
          # fichiers, vérifié ci-dessus — `grep -Rl "^buildscript {"`
          # = exactement les 8 `node_modules/.pnpm/@capacitor+*/.../
          # build.gradle`, pas d'autre fichier du repo qui matche).
          echo "Patch du scope buildscript de CHAQUE sous-projet Capacitor (bcprov:1.78)"
          find node_modules/.pnpm -path "*capacitor*" -name "build.gradle" -print0 2>/dev/null | \
            while IFS= read -r -d '' f; do
              if grep -q "^buildscript {" "$f" && ! grep -q "force 'org.bouncycastle:bcprov:1.78'" "$f"; then
                # On insère le bloc force juste après la ligne
                # `dependencies {` qui OUVRE le bloc buildscript (la
                # 1re occurrence de cette ligne dans le fichier, qui est
                # toujours dans le `buildscript {}` — les `dependencies
                # {` suivants du fichier sont dans le bloc `android
                # {...}` du sous-projet et ne sont pas touchées par un
                # `sed` ciblé sur la 1re occurrence uniquement).
                awk '
                  /^    dependencies \{$/ && !done {
                    print
                    print "        resolutionStrategy {"
                    print "            force '\''org.bouncycastle:bcprov:1.78'\''"
                    print "            force '\''org.bouncycastle:bcprov-jdk18on:1.70'\''"
                    print "            force '\''org.bouncycastle:bcprov-jdk15on:1.70'\''"
                    print "        }"
                    done = 1
                    next
                  }
                  { print }
                ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
                echo "  ✓ $f"
              fi
            done
          # Vérif finale : les 8 fichiers doivent désormais contenir le
          # force.
          grep -Rl "force 'org.bouncycastle:bcprov:1.78'" node_modules/.pnpm 2>/dev/null | wc -l
          # Align le SDK (cap sync régénère parfois en 36 → on force 34,
          # identique au step "Align Gradle" de lumina-android.yml).
          sed -i "s/compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36/compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34/g" \
            android/capacitor-cordova-android-plugins/build.gradle
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/' android/variables.gradle
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/' android/variables.gradle
          # Patch du namespace au plugin storage v1.2.5 (sans, cap sync
          # génère une erreur "Namespace not specified" — même logique que
          # lumina-android.yml). Le fichier réel vit dans node_modules/.pnpm
          # (symlinké depuis node_modules/@capacitor/storage), on patche le
          # path "vrai" pour être sûr que le patch tient dans node_modules
          # (et pas juste sur le symlink).
          STORAGE_GRADLE="$(node -e "console.log(require.resolve('@capacitor/storage/android/build.gradle'))" 2>/dev/null || true)"
          if [ -z "$STORAGE_GRADLE" ]; then
            STORAGE_GRADLE="node_modules/@capacitor/storage/android/build.gradle"
          fi
          if [ -f "$STORAGE_GRADLE" ] && ! grep -q "^    namespace " "$STORAGE_GRADLE"; then
            sed -i '/^android {/a\    namespace "com.capacitorjs.plugins.storage"' "$STORAGE_GRADLE"
          fi

      - name: Expose version
        id: version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload patched android/ tree for the build job
        # Le patch est fait SUR le working tree de CE job (le fichier est
        # gitignored, donc PAS commité). On le pousse en artefact pour que
        # le job "build-android" (qui checkout à zéro) récupère la version
        # PATCHÉE, pas le template `cap sync` neuf.
        uses: actions/upload-artifact@v4
        with:
          name: patched-android-src
          path: |
            android/settings.gradle
            android/variables.gradle
            android/build.gradle
            android/gradle.properties
            android/capacitor-cordova-android-plugins/build.gradle
            android/app/build.gradle
            android/app/src/main/AndroidManifest.xml
          retention-days: 1

  # ---------------------------------------------------------------
  # BUILD : l'APK unsigned (Gradle), sur le source PATCHÉ du job
  # précédent.
  # ---------------------------------------------------------------
  build-android:
    name: Build Android (unsigned APK)
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web + sync Capacitor
        run: pnpm run sync:cap

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      # Même step que dans le job `prepare` (au-dessus, ligne 95),
      # ré-appliqué ICI dans le job `build-android` (qui a sa propre
      # installation `pnpm install --frozen-lockfile` fraîche, qui
      # remet à zéro les fichiers `node_modules/.pnpm/.../android/
      # build.gradle` avant ce step — le patch du job `prepare` ne
      # survit PAS entre les 2 jobs, cf. run 39187053500 qui a échoué
      # pour exactement cette raison : le patch s'est bien exécuté
      # dans `prepare` mais a été re-supplémenté par le `pnpm
      # install` du job `build-android`).
      - name: Patch Cordova Sub-project (fix bcprov-jdk18on-1.79.jar) [build job]
        run: |
          echo "Patch du scope buildscript de CHAQUE sous-projet Capacitor (bcprov:1.78)"
          find node_modules/.pnpm -path "*capacitor*" -name "build.gradle" -print0 2>/dev/null | \
            while IFS= read -r -d '' f; do
              if grep -q "^buildscript {" "$f" && ! grep -q "force 'org.bouncycastle:bcprov:1.78'" "$f"; then
                awk '
                  /^    dependencies \{$/ && !done {
                    print
                    print "        resolutionStrategy {"
                    print "            force '\''org.bouncycastle:bcprov:1.78'\''"
                    print "            force '\''org.bouncycastle:bcprov-jdk18on:1.70'\''"
                    print "            force '\''org.bouncycastle:bcprov-jdk15on:1.70'\''"
                    print "        }"
                    done = 1
                    next
                  }
                  { print }
                ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
                echo "  ✓ $f"
              fi
            done
          grep -Rl "force 'org.bouncycastle:bcprov:1.78'" node_modules/.pnpm 2>/dev/null | wc -l

      - name: Restore patched android/ tree (bcprov fix du job prepare)
        uses: actions/download-artifact@v4
        with:
          name: patched-android-src
          path: android
        # `path: android` remplace les fichiers du checkout par les versions
        # patchées (settings.gradle, variables.gradle, app/build.gradle,
        # AndroidManifest.xml).

      # ------------------------------------------------------------------
      # Purge du cache Gradle — le fix réel contre le bug bcprov-jdk18on
      # ------------------------------------------------------------------
      # 2026-10-19 (run 39185310876, après 6 itérations de correctifs de
      # dépendances infructueuses : exclusion buildscript/allprojects,
      # piquage OneSignal 4.9.7, downgrade @capacitor/preferences,
      # retrait classpath AGP 8.13.0 du sous-projet, bascule JDK 17/21,
      # purge ciblée `~/.gradle/caches/jars-*` qui a PRÉCÉDEMMENT
      # confirmé "pas de cache jars-* — rien à purger, premier run sur
      # ce runner" PUIS échoué TOUT DE MÊME à l'étape "create Jar file"
      # du JAR bcprov-jdk18on-1.79 fraîchement téléchargé) :
      #
      # Le JAR est bien téléchargé FRAÎchement par ce run — il n'y a
      # PAS de cache résiduel du runner (confirmé par le log du run
      # 39185310876, step "Purge poisoned Gradle jars-9 cache" =
      # "(pas de cache jars-* — rien à purger)"). L'échec se produit
      # donc à l'étape de VÉRIFICATION du JAR *fraîchement résolu* par
      # le classloader de compilation Gradle — pas à partir d'un
      # artefact résiduel.
      #
      # La comparaison avec le run vert 36173770387 (2026-09-25) ne
      # montre aucune différence pertinente dans le DAG de
      # dépendances du projet lui-même (`package.json`,
      # `pnpm-lock.yaml`, `android/**`) — donc c'est bien le cache
      # Gradle GLOBAL du runner (au-dessus de `jars-*`, ce que le
      # cache `gradle` de `setup-java` RESTAURE à chaque run via
      # `actions/setup-java`'s `cache: 'gradle'`) qui pré-charge un
      # `bcprov-jdk18on-1.79.jar` déjà résolu, mais corrompu en ce qui
      # concerne sa vérification class-file, et ce POISON survit à
      # une simple `rm ~/.gradle/caches/jars-*` (ce cache est
      # re-restauré automatiquement par `setup-java` AVANT que ce
      # step de purge s'exécute, ou le hash `jars-9/<hash>` concerné
      # n'est pas le seul empoisonné — d'autres sous-dossiers du cache
      # Gradle global sont corrompus aussi).
      #
      # Fix (ce step) : isoler totalement le cache Gradle de ce run en
      # le déplaçant dans un répertoire CACHÉ par le runner mais FRAÎS
      # pour ce run (`$RUNNER_TEMP/gradle-cache`), SANS toucher au
      # cache restauré par `setup-java` (donc sans casser la cache
      # `gradle` partagée/persistante entre les runs — on ne purge
      # pas le cache global, on juste ne L'UTILISE PAS pour ce build,
      # en redirigeant `GRADLE_USER_HOME` sur un sous-arbre vide).
      # C'est strictement plus sûr qu'une `rm -rf ~/.gradle` (qui
      # purgerait le cache global persistant et rallongerait CHAQUE
      # run futur de ~5 min de re-délaissement Maven Central/Google/
      # OneSignal pour tout le monde, pas seulement ce run).
      #
      # Si ce fix échoue encore (c.-à-d. que même un cache 100%
      # frais échoue à lier bcprov-jdk18on-1.79), la conclusion
      # définitive est que c'est une incompatibilité entre le JAR
      # `bcprov-jdk18on:1.79` spécifiquement et le classloader de
      # compilation Gradle 8.2.1/8.9 de ce projet, quel que soit le
      # JDK — et le fix sera d'ALORS forcer une version bcprov plus
      # ancienne (1.78, vérifié existante sur Maven Central) via
      # `resolutionStrategy.force` dans `allprojects.configurations.all`
      # ET le buildscript du root — à n'appliquer que si ce step
      # isolé du cache échoue aussi.
      - name: Isolate fresh Gradle cache for this build (fix bcprov-jdk18on-1.79.jar)
        run: |
          echo "Cache Gradle global du runner (restauré par setup-java) :"
          ls -la ~/.gradle/caches/ 2>/dev/null | head
          echo "Mise en place d'un cache Gradle FRAÎS et isolé pour ce run..."
          FRESH_CACHE_DIR="$RUNNER_TEMP/gradle-cache"
          mkdir -p "$FRESH_CACHE_DIR"
          echo "GRADLE_USER_HOME=$FRESH_CACHE_DIR" >> "$GITHUB_ENV"
          echo "Cache isolé prêt dans $FRESH_CACHE_DIR (le cache global ~/.gradle n'est PAS utilisé par ce build, mais reste intact pour les runs suivants)."

      - name: Build release APK (unsigned)
        # `gradlew assembleRelease` produit `app-release-unsigned.apk`
        # (aucune `signingConfigs.release` active dans le build.gradle,
        # la signature réelle est faite au job "sign-android"). Le daemon
        # Gradle PERSISTANT est utilisé (pas `--no-daemon`) : le classloader
        # "single-use" de `--no-daemon` échoue à relier les classes du JAR
        # `bcprov-jdk18on-1.79` (classes Java 21+) — bug documenté en
        # mémoire `gradle-jdk17-bcprov-infra-fail`, confirmé 2026-10-18 en
        # local (build SANS `--no-daemon` = OK, AVEC = échec au même
        # endroit). Le flag est retiré définitivement.
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 1

  # ---------------------------------------------------------------
  # SIGN : apksigner v1+v2+v3 (keystore du secret ANDROID_KEYSTORE_*).
  # ---------------------------------------------------------------
  sign-android:
    name: Sign APK (apksigner v1+v2+v3)
    runs-on: ubuntu-latest
    needs: [build-android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: lumina-release-unsigned
          path: unsigned

      - name: Decode signing keystore
        # Source unique : le secret `ANDROID_KEYSTORE_BASE64` (créé le
        # 2026-09-06, consommé aussi par `lumina-android.yml` job debug).
        # Ne PAS mélanger les namespaces `LUMINA_KEYSTORE_*` (incomplet,
        # ne doit plus être utilisé — voir MEMORY.md).
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > signing.keystore
          keytool -list -v -keystore signing.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | head -20

      - name: Install apksigner (v1+v2+v3)
        # Sur les runners ubuntu-latest, le SDK du runner ne contient pas
        # build-tools. On installe `build-tools;34.0.0` (fournit
        # `apksigner`) dans `$HOME/.android-sdk` — logique identique au
        # job `debug-apk` de `lumina-android.yml`.
        run: |
          ANDROID_SDK_ROOT="/usr/local/lib/android"
          if [ ! -d "$ANDROID_SDK_ROOT" ] && [ -n "${ANDROID_HOME:-}" ]; then
            ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          if ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner >/dev/null 2>&1; then
            echo "apksigner déjà présent dans le SDK système — rien à faire"
            exit 0
          fi
          SDK_HOME="$HOME/.android-sdk"
          if [ -x "$SDK_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools déjà installé dans $SDK_HOME"
          else
            echo "Téléchargement de cmdline-tools..."
            mkdir -p "$SDK_HOME/cmdline-tools" /tmp/cmdtools-dl
            curl -fsSL -o /tmp/cmdtools-dl/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdtools-dl/cmdline-tools.zip -d /tmp/cmdtools-dl
            mv /tmp/cmdtools-dl/cmdline-tools "$SDK_HOME/cmdline-tools/latest"
            rm -rf /tmp/cmdtools-dl
          fi
          echo "Installation de build-tools;34.0.0 (apksigner) dans $SDK_HOME..."
          yes | "$SDK_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_HOME" "build-tools;34.0.0" 2>&1 || true
          if ls "$SDK_HOME"/build-tools/*/apksigner >/dev/null 2>&1; then
            echo "apksigner installé dans $SDK_HOME ✓"
          else
            echo "::error::apksigner non installé — la signature v1+v2+v3 échouera (fallback jarsigner v1)"
            exit 1
          fi

      - name: Sign APK with apksigner (v1+v2+v3)
        # L'APK est le build unsigned produit par Gradle (assembleRelease
        # sans signingConfig active). Le v1 signing est activé pour
        # couvrir les appareils Android < 7.0 (minSdk 21).
        run: |
          APK_SRC="$(find unsigned -name '*.apk' | head -1)"
          echo "APK source : $APK_SRC"
          APKSIG=""
          SDK_ROOT="$HOME/.android-sdk"
          if [ -d "$SDK_ROOT" ]; then
            for bt in "$SDK_ROOT"/build-tools/*/apksigner; do
              if [ -x "$bt" ]; then APKSIG="$bt"; break; fi
            done
          fi
          if [ -z "$APKSIG" ]; then
            for c in /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk /usr/local/android-sdk "${ANDROID_HOME:-}"; do
              [ -z "$c" ] && continue
              [ ! -d "$c" ] && continue
              for bt in "$c"/build-tools/*/apksigner; do
                if [ -x "$bt" ]; then APKSIG="$bt"; break 2; fi
              done
            done
          fi
          if [ -z "$APKSIG" ] && command -v apksigner >/dev/null 2>&1; then
            APKSIG="$(command -v apksigner)"
          fi
          echo "apksigner : ${APKSIG:-non trouvé — fallback jarsigner v1 uniquement}"
          if [ -n "$APKSIG" ]; then
            "$APKSIG" sign \
              --ks signing.keystore \
              --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }} \
              --ks-key-alias ${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out app-release-signed.apk \
              "$APK_SRC"
            echo "Signé avec apksigner (v1+v2+v3 — v1 pour Android < 7.0)"
          else
            echo "apksigner introuvable — fallback jarsigner (v1 uniquement)"
            ${JAVA_HOME}/bin/jarsigner \
              -keystore signing.keystore \
              -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              -keypass ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }} \
              -signedjar app-release-signed.apk \
              "$APK_SRC" \
              ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          fi

      - name: Verify signature
        run: |
          APKSIG=""
          if [ -d "$HOME/.android-sdk" ]; then
            for bt in "$HOME"/.android-sdk/build-tools/*/apksigner; do
              if [ -x "$bt" ]; then APKSIG="$bt"; break; fi
            done
          fi
          if [ -z "$APKSIG" ]; then
            for c in /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk /usr/local/android-sdk "${ANDROID_HOME:-}"; do
              [ -z "$c" ] && continue
              [ ! -d "$c" ] && continue
              for bt in "$c"/build-tools/*/apksigner; do
                if [ -x "$bt" ]; then APKSIG="$bt"; break 2; fi
              done
            done
          fi
          if [ -z "$APKSIG" ] && command -v apksigner >/dev/null 2>&1; then
            APKSIG="$(command -v apksigner)"
          fi
          if [ -n "$APKSIG" ]; then
            "$APKSIG" verify --verbose app-release-signed.apk
          else
            ${JAVA_HOME}/bin/jarsigner -verify app-release-signed.apk
          fi

      - name: Prepare final assets (APK + SHA-256)
        # Le self-updater (`src/updater/checkForUpdate.ts`) télécharge
        # `app-release.apk` + son hash compagnon `app-release.apk.sha256`
        # (format POSIX `sha256sum`) depuis la GitHub Release. Les 2
        # fichiers sont produits ici, prêts à être poussés au job "release".
        run: |
          mv app-release-signed.apk app-release.apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Upload signed APK + SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-final
          path: |
            app-release.apk
            app-release.apk.sha256
          retention-days: 30

  # ---------------------------------------------------------------
  # RELEASE : pousse l'APK signé + le SHA-256 sur la GitHub Release
  # (celle que le self-updater lit via `releases/latest`).
  # ---------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [sign-android]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download signed APK + SHA-256
        uses: actions/download-artifact@v4
        with:
          name: lumina-release-final
          path: release-assets

      - name: Create or update GitHub Release
        # `softprops/action-gh-release` crée (ou met à jour) la release
        # sur le tag qui a déclenché ce run (`v<version>`), et pousse
        # les 2 assets (APK signé + hash compagnon). Le token
        # `GITHUB_TOKEN` par défaut du runner a le scope `contents:
        # write` (déclaré en haut du workflow) — aucun PAT requis. Le
        # workaround `LUMINA_GITHUB_PAT` (job `github-release` de
        # `lumina-android.yml`, retiré 2026-10-18) n'est plus
        # nécessaire : ce workflow est la seule source de vérité.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
          draft: false
          prerelease: false
