ext {
    // minSdk 21 : Lumina cible les téléphones simples / anciens (5.0+).
    // Capacitor 7 propose 23 par défaut, mais lit `rootProject.ext.minSdkVersion`
    // s'il est présent — on conserve donc 21 volontairement (l'app reste
    // installable sur Android 5.0+ ; Play Store exige targetSdk 24 minimum).
    minSdkVersion = 21
    // compileSdk/targetSdk 35 : Capacitor 7 (android) compile contre l'API 35
    // (VANILLA_ICE_CREAM) — avec 34, `:capacitor-android:compileDebugJavaWithJavac`
    // échoue (« cannot find symbol VANILLA_ICE_CREAM »).
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}