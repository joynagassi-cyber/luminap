ext {
    // Capacitor 8 impose minSdk 24 (Android 7.0). On abandonne minSdk 21 :
    // d'une part Capacitor 8 / @capacitor-community/sqlite (stockage SQLite
    // natif de PowerSync) exigent l'API 24, d'autre part la bibliothèque
    // SQLCipher embarquée ne supporte pas les API antérieures.
    minSdkVersion = 24
    // compileSdk/targetSdk 36 : Capacitor 8 (android) compile contre l'API 36.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}