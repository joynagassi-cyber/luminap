apply plugin: 'com.android.application'

android {
    namespace "com.lumina.mfejc"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lumina.mfejc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        resValue "string", "onesignal_app_id", "5482a4eb-a402-4612-ab5e-a72df7961b12"
        resValue "string", "onesignal_google_project_number", "remote"
    }

    // Self-updater : signature release pilotée par l'environnement CI
    // (github actions : KEYSTORE_PATH/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD).
    // Les défauts vides gardent le build debug local fonctionnel ; le CI
    // fournit les vraies valeurs (le CI existant signe en revanche via apksigner).
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: ""
            if (ksPath != "") {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            // Unsigned by Gradle — la signature réelle est faite en CI
            // par apksigner (job "Sign APK") avec le keystore
            // ANDROID_KEYSTORE_BASE64. Absence de signingConfig génère
            // un app-release-unsigned.apk.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Pas de R8 : le build doit rester compatible avec les
            // téléphones simples / anciens (mémoire limitée, pas de
            // re-bouclage d'annotations à la compilation).
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    maven {
        url "https://maven.onesignal.com"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // 2026-10-19 : OneSignal PINTÉ à 4.9.7 (dernière version 4.x, qui
    // n'embarque PAS la dépendance transitive `bcprov-jdk18on:1.79` —
    // celle-ci n'apparaît qu'à partir des versions 5.x+ du SDK, qui
    // ont fait migrer le chiffrement E2EE vers BouncyCastle jdk18on).
    // Le range ouvert `[5.0.0, 5.99.99]` résolait automatiquement à la
    // dernière 5.x/6.x publiée, qui tire `bcprov-jdk18on:1.79` (jar
    // compilé pour Java 21) — ce JAR échoue à se lier par le classloader
    // de compilation Gradle, quel que soit le JDK du runner (confirmé
    // runs 39180389543/39182394813/39182942531/39183807849, sur JDK 21
    // ET JDK 17, avec exclusion ou non du JAR : c'est une incompatibilité
    // de class-file-version intrinsèque au jar, pas un problème de
    // résolution qu'on peut contourner en l'excluant du classpath).
    //
    // Piquer au-dessous de 5.x ne retire PAS OneSignal de l'app :
    // l'intégration Capacitor push (`@capacitor/push-notifications`) et
    // le `resValue onesignal_app_id`/`google_project_number` ci-dessus
    // restent fonctionnels — seule la feature E2EE (chiffrement des
    // payloads, NON activée ici) repose sur BC. Si un besoin de 5.x
    // apparaît un jour (nouvelle feature), il faudra re-traiter le bug
    // bcprov à ce moment-là, pas avant.
    implementation 'com.onesignal:OneSignal:4.8.12'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
