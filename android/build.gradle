// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // 2026-10-19 : exclusion ciblée du JAR bcprov-jdk18on (la ligne
        // d'artifact BouncyCastle "Java 18+" qu'OneSignal tire via
        // sa dépendance transitive — résout à 1.79, classes compilées
        // pour Java 21, class file version 65) du classpath de build
        // lui-même. Ce scope (`buildscript.configurations.classpath`)
        // est SÉPARÉ du scope `allprojects.configurations.all` (projet),
        // et les deux doivent être couverts indépendamment.
        //
        // NE PAS exclure `bcprov-jdk15on` : c'est la ligne "Java 5+"
        // qu'AGP 8.2.1 exige réellement (résout à 1.67, lié sans
        // problème) — l'exclure casse la résolution du classpath de
        // build (erreur "Could not find org.bouncycastle:bcprov-jdk15on",
        // run 39182394813).
        configurations.classpath {
            exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        }
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // 2026-10-19 : EXCLUSION CIBLÉE, uniquement de `bcprov-jdk18on`
    // (la ligne d'artifact BouncyCastle "Java 18+" qu'OneSignal tire
    // via sa dépendance transitive — résout à `1.79`, le JAR qui
    // échoue à se vérifier par le classloader de compilation Gradle
    // sur les runners GitHub).
    //
    // NE PAS exclure `bcprov-jdk15on` (la ligne "Java 5+/15+" qu'AGP
    // `com.android.tools.build:gradle:8.2.1` exige réellement, via
    // `com.android.tools:sdk-common`/`apkzlib`/`builder`, et qui
    // résout à `1.67` — ce JAR, lui, se lie sans problème et est
    // REQUIS par AGP ; l'exclure casse la résolution du classpath de
    // build, c'était un excès de zèle dans les itérations précédentes).
    // NE PAS forcer de version (`force '...jdk18on:1.78'` /
    // `force '...jdk15on:1.78'`) : `bcprov-jdk15on` n'est plus publié
    // au-delà de ~1.70 (BouncyCastle a unifié les variants en un
    // seul artifact `bcprov` depuis ~1.71) — forcer `1.78` sur
    // `jdk15on` pointe vers une coordinate qui n'existe pas sur Maven
    // Central (erreur "Could not find org.bouncycastle:bcprov-jdk15on:
    // 1.78", run 39181048751).
    //
    // `bcprov-jdk18on` est le seul fautif réel : il n'est tiré QUE par
    // `com.onesignal:OneSignal` (wildcard `[5.0.0, 5.99.99]`) dans le
    // scope `implementation` du projet `:app`, et par le bloc
    // `buildscript AGP 8.13.0` des plugins Capacitor (déjà retiré par
    // le step CI "Patch Cordova Sub-project"). OneSignal n'utilise BC
    // qu'à l'exécution pour le chiffrement E2EE optionnel (non activé
    // ici — le payload n'est pas chiffré côté E2EE), donc l'exclusion
    // compile-time est sûre : le code de OneSignal n'est pas lié
    // contre BC au moment de la compilation.
    configurations.all {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
