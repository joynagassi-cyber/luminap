// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }

    // 2026-10-19 (fix définitif bug "Failed to create Jar file bcprov-jdk18on-
    // 1.79.jar" en CI Temurin 21) : le "Failed to create Jar file" n'a PAS
    // lieu dans les configurations de PROJET (déjà couvertes par
    // `allprojects.configurations.all.exclude` ci-dessous) — il a lieu sur le
    // **classpath de build** lui-même (`buildscript { classpath ... }`), qui
    // est un conteneur de configurations SÉPARÉ (`buildscript.configurations.
    // classpath`) et n'est PAS couvert par `allprojects.configurations.all`.
    //
    // Cause réelle : `com.android.tools.build:gradle:8.2.1` tire
    // transitivement `org.bouncycastle:bcprov-jdk18on:1.79` (AGP utilise BC
    // pour la signature de keystores). Ce JAR échoue à être vérifié/
    // instrumenté par le classloader de classpath de compilation Gradle
    // sous Temurin 21 sur les runners GitHub (classes bcprov 1.79 = "jdk18on",
    // incompatibilité de class-file-version à l'étape "create Jar file" du
    // resolve du classpath de build — voir mémoire
    // `gradle-jdk17-bcprov-infra-fail`). Retirer la ligne
    // `classpath AGP 8.13.0` des sous-projets/plugins Capacitor (déjà fait
    // par le step CI "Patch Cordova Sub-project") ne suffit pas : le
    // buildscript de CETTE racine (ligne AGP 8.2.1 + google-services) tire
    // la même dépendance bcprov 1.79 par une autre route.
    //
    // Fix : exclure `bcprov` du classpath de build explicitement (scope
    // `buildscript.configurations.classpath`, distinct du scope projet).
    // OneSignal/AGP n'ont besoin de BC qu'à l'exécution pour une feature
    // optionnelle (E2EE / signature JAR à chaud) — le compile-time du
    // buildscript ne requiert pas ces classes, l'exclusion est sûre.
    configurations.classpath {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // 2026-10-18 (audit release v1.0.2) : EXCLURE BouncyCastle (bcprov)
    // du classpath de build.
    //
    // Cause racine de l'échec reproductible "Failed to create Jar file
    // .../jars-9/<hash>/bcprov-jdk18on-1.79.jar" (bug d'infrastructure
    // documenté en mémoire gradle-jdk17-bcprov-infra-fail) :
    //
    //   com.onesignal:OneSignal (wildcard [5.0.0, 5.99.99] → résout à la
    //   dernière, qui tire org.bouncycastle:bcprov-jdk18on:1.79) embarque
    //   BouncyCastle pour le chiffrement E2EE optionnel, NON utilisé par
    //   l'app (le payload n'est pas chiffré côté E2EE). Ce jar 1.79 est
    //   compilé pour Java 21 (classes BC 1.79 = jdk18on, target min Java
    //   18) et échoue à se relier par le classloader de compilation
    //   Gradle 8.2.1 sous Temurin 21 (jars-9 = le "classpath cache" de
    //   Gradle qui "crée" les jars du classpath).
    //
    // Solution : EXCLURE le module bcprov-jdk18on de l'ensemble du
    // classpath (pas juste forcer une version — le problème est le jar
    // lui-même, pas sa version). OneSignal reste installable : il
    // n'exige bcprov qu'à l'exécution pour une feature optionnelle
    // (E2EE), non déclarée comme dépendance hard de son AAR ; à la
    // compilation, son code n'est pas lié contre BC. Si OneSignal
    // exigeait BC au runtime et qu'on casse le push, on verra au test.
    configurations.all {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
