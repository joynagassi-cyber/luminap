# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Heap 4096m (augmented from 1536m per android-build-cl #2 to mitigate
# « Failed to create Jar file ... bcprov-jdk18on » on classpath build).
#
# 2026-10-18 (audit release v1.0.2) : on bascule le runner sur le JDK
# 17 (Temurin) au lieu du 21. Cause racine de l'erreur
# "Failed to create Jar file .../bcprov-jdk18on-1.79.jar" : le JAR
# bcprov 1.79 (dépendance transitive de com.onesignal:OneSignal +
# @capacitor/preferences) est compilé pour Java 17 — sous Temurin 21
# sur les runners GitHub, le classloader de compilation Gradle échoue
# à re-lier ces classes ("Failed to create Jar file"). Le run
# 36173770387 (JDK 17, le même que le build natif local validé en
# mémoire du projet) a démontré que le build passe proprement.
#
# C'est le même flag qui est lu par le step 'setup-java' des 2
# workflows CI (lumina-android.yml JAVA_VERSION=17, release.yml
# java-version=17) ET par le build natif local (JDK 17, cf. mémoire
# gradle-jdk17-bcprov-infra-fail).
org.gradle.jvmargs=-Xmx4096m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
