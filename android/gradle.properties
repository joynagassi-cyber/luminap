# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m

# 2026-10-19 : le build Gradle DOIT tourner sous JDK 17 (Temurin) et
# non 21 pour éviter le bug reproductible "Failed to create Jar file
# .../jars-9/<hash>/bcprov-jdk18on-1.79.jar" (jar bcprov 1.79 = class
# file version 65/Java 21, impossible à relier par le classloader de
# compilation Gradle sous Temurin 21 — confirmé run 39182942531,
# indépendant des exclusions de dépendances / flag --no-daemon). Le
# run GREEN de référence (36173770387) tournait en JDK 17.
#
# On ne force PAS `org.gradle.java.home` ici : le chemin exact dans
# /opt/hostedtoolcache change avec les patches Temurin poussés par les
# runners GitHub (version mineure variable, cf. run 39182942531 =
# 21.0.12-1) — un path codé en dur casserait le build non CI (local,
# Android Studio) dès que le numéro de patch bouge. Le sélecteur de
# JDK est géré UNIQUEMENT par `actions/setup-java` (JAVA_VERSION) dans
# les 2 workflows CI (`release.yml` + `lumina-android.yml`), qui
# pointe `JAVA_HOME` sur le bon install Temurin préinstallé par le
# runner — le wrapper Gradle hérite de ce `JAVA_HOME` nativement.

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
