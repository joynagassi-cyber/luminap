name: Keep-alive Supabase (anti-pause Free)

# Le plan Free de Supabase met le projet en pause après 7 jours de faible
# activité BASE. L'activité interne (job pg_cron `keep_alive_daily`) ne
# protège pas : elle vit DANS la base, donc elle s'arrête avec elle. Seul un
# appel EXTERNE remet le compteur à zéro. Ce workflow est cet appel externe.
#
# CE QUI A CHANGÉ (2026-10-27) — le ping devient vérifiable
#   Avant : GET /rest/v1/keep_alive → une LECTURE. Elle ne laisse aucune
#   trace, donc rien ne prouvait après coup qu'un ping avait eu lieu, et la
#   procédure de contrôle du RUNBOOK (« last_ping < 48 h ») validait en
#   réalité pg_cron, pas GitHub.
#   Après : POST /rest/v1/rpc/keep_alive_ping → une ÉCRITURE idempotente.
#   Chaque ping incrémente `external_count` et pose `external_ping = now()`,
#   colonnes que pg_cron ne touche JAMAIS. Les deux mécanismes sont enfin
#   distinguables, et un ping manqué devient visible.
#   Pré-requis : migration 20261027000003 (ou rollback associé).
#
# LIMITES ASSUMÉES (mesurées sur ce dépôt)
#   - GitHub n'exécute pas les schedules à l'heure : cron 06:00 UTC → runs
#     réels à 10:58 et 11:48 les 25 et 27/10/2026 (+5 h). On ne compte donc
#     JAMAIS sur l'heure, seulement sur « au moins une fois tous les 2 jours ».
#   - Un run planifié peut être retardé ou abandonné sous charge : rien de
#     silencieux n'est garanti côté GitHub. Le contrôle de fraîcheur ci-dessous
#     couvre le cas « exécuté mais échoué » ; le cas « jamais exécuté » exige
#     un moniteur externe (voir RUNBOOK).
#   - Dépôt PUBLIC : GitHub coupe TOUS les schedules après 60 jours SANS
#     COMMIT. D'où le contrôle d'activité du dépôt en fin de job.
#
# DÉCLENCHEURS
#   - cron '0 6 */2 * *' = jours IMPAIRS du mois à 06:00 UTC (1,3,5,…,31).
#     Écart maximal calculé : 2 jours (fin de mois pair) — très en deçà du
#     seuil de pause de 7 jours.
#   - workflow_dispatch : pour tester immédiatement.

on:
  schedule:
    - cron: '0 6 */2 * *'
  workflow_dispatch:

# Deux pings simultanés n'ont aucun intérêt : on sérialise.
concurrency:
  group: keep-alive-supabase
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ping:
    name: Ping externe Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping base (RPC en écriture) + Auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hhgovvrnalibhgpakswi.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_kwbReVxSdHLx_u2IzQvGaA_Eegsf2Sh' }}
        run: |
          set -uo pipefail
          ok=1

          echo "::group::RPC /rest/v1/rpc/keep_alive_ping (écriture)"
          rpc_code=$(curl -sS --max-time 20 -o /tmp/rpc.out -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || echo 000)
          echo "HTTP $rpc_code"
          echo "corps : $(head -c 300 /tmp/rpc.out 2>/dev/null)"
          echo "::endgroup::"
          case "$rpc_code" in 2*) ;; *) ok=0 ;; esac

          # Preuve d'écriture : la réponse doit contenir external_ping ET un
          # compteur > 0. Un 200 avec un corps vide signifierait que la
          # fonction n'a pas été exécutée (droits ou signature) — on refuse.
          count=$(sed -n 's/.*"external_count"[[:space:]]*:[[:space:]]*\([0-9]\+\).*/\1/p' /tmp/rpc.out | head -1)
          ping=$(sed -n 's/.*"external_ping"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/rpc.out | head -1)
          if [ -z "$count" ] || [ -z "$ping" ] || [ "$count" -lt 1 ]; then
            echo "::error::RPC keep_alive_ping a répondu sans preuve d'écriture (external_count='$count', external_ping='$ping'). Vérifier la migration 20261027000003 et le GRANT EXECUTE à anon."
            ok=0
          else
            echo "Ping externe n°$count enregistré à $ping (UTC, horloge serveur)."
          fi

          echo "::group::Auth /auth/v1/health"
          auth_code=$(curl -sS --max-time 20 -o /tmp/auth.out -w '%{http_code}' \
            "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY" || echo 000)
          echo "HTTP $auth_code"
          echo "corps : $(head -c 200 /tmp/auth.out 2>/dev/null)"
          echo "::endgroup::"
          case "$auth_code" in 2*) ;; *) ok=0 ;; esac

          if [ "$ok" -ne 1 ]; then
            echo "::error::Keep-alive en échec (RPC=$rpc_code, Auth=$auth_code). Causes probables : projet en PAUSE, clé publishable révoquée, ou migration 20261027000003 absente. Vérifier le tableau de bord Supabase."
            exit 1
          fi
          echo "OK — activité EXTERNE enregistrée le $(date -u +%FT%TZ)."

      # « Jamais exécuté » est le seul échec que ce workflow ne peut pas
      # détecter lui-même. On vérifie donc au moins la condition qui coupe les
      # schedules : 60 jours sans commit sur un dépôt public.
      - name: Contrôler que les schedules du dépôt sont actifs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          state=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/keep-alive.yml" \
            | sed -n 's/.*"state"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
          echo "état du workflow : ${state:-inconnu}"
          if [ "$state" != "active" ]; then
            echo "::error::Workflow « keep-alive » à l'état '${state:-inconnu}' — les schedules sont coupés. Réarmer : gh workflow enable keep-alive.yml (GitHub coupe les schedules d'un dépôt public après 60 jours sans commit)."
            exit 1
          fi
