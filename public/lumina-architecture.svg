<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200" role="img" aria-label="Architecture complète de Lumina : client React 19 + Ionic, capacités métier testables, synchronisation offline-first PowerSync, backend Supabase et démultipliation web et mobile">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#808080"/>
    </marker>
  </defs>

  <!-- ══ Fond ═══════════════════════════════════════════════════════════════ -->
  <rect width="2400" height="1200" fill="#121212"/>

  <!-- ══ Titre ═════════════════════════════════════════════════════════════ -->
  <text x="64" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">Lumina — Architecture complète</text>
  <rect x="64" y="86" width="120" height="4" rx="2" fill="#FF6B00"/>
  <text x="64" y="120" font-family="Arial" font-size="15" fill="#B3B3B3">Plateforme financière offline-first · React 19 + Ionic 9 · Capacitor Android · 14 capacités · 31 PowerSync streams · RLS Supabase</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  ZONE 1 — CLIENT (colonne gauche, x 64–1150)                          -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="64" y="150" width="1090" height="940" rx="18" fill="none" stroke="#282828" stroke-width="1.5"/>
  <text x="92" y="182" font-family="Arial" font-size="13" font-weight="700" fill="#FF8533" letter-spacing="2">① CLIENT — REACT 19 + IONIC 9 (IONPAGE, IONROUTER, IONPLITPANE)</text>

  <!-- ── 1a. Pages ── -->
  <rect x="92" y="200" width="1034" height="86" rx="10" fill="#212121" stroke="#282828"/>
  <text x="112" y="232" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF">38 pages métier (Ionic — 11 sections de routes, tableau plat)</text>
  <text x="112" y="254" font-family="Arial" font-size="13" fill="#B3B3B3">Finance (caisse, transactions, versements, budgets) · Groupes &amp; membres · Événements &amp; calendrier · Rapports inter-org · Formulaires &amp; champs</text>
  <text x="112" y="272" font-family="Arial" font-size="13" fill="#808080">RBAC 14 rôles · thème sombre/clair (accent #FF6B00) · React Query · Tailwind + shadcn/ui · montage lazy par section</text>

  <!-- flèche 1a → 1b -->
  <line x1="609" y1="288" x2="609" y2="310" stroke="#FFB800" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="624" y="304" font-family="Arial" font-size="12" fill="#B3B3B3">appel (aucun import réciproque)</text>

  <!-- ── 1b. Couche capacités (2 rangées × 4) ── -->
  <text x="112" y="332" font-family="Arial" font-size="14" font-weight="700" fill="#FFFFFF">Capacités métier — façades pures, sans UI, sans imports croisés (enforce par test d'architecture)</text>
  <!-- Rangée A -->
  <rect x="112" y="346" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="231" y="368" font-family="Arial" font-size="13" font-weight="600" fill="#FF8533" text-anchor="middle">Identity</text>
  <text x="231" y="388" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">profil utilisateur (in-memory)</text>

  <rect x="364" y="346" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="483" y="368" font-family="Arial" font-size="13" font-weight="600" fill="#FF8533" text-anchor="middle">Organization</text>
  <text x="483" y="388" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">contexte org + unités (→ Identity)</text>

  <rect x="616" y="346" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="735" y="368" font-family="Arial" font-size="13" font-weight="600" fill="#FF8533" text-anchor="middle">Security</text>
  <text x="735" y="388" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">façade RBAC (délègue lib/rbac)</text>

  <rect x="868" y="346" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="987" y="368" font-family="Arial" font-size="13" font-weight="600" fill="#FF8533" text-anchor="middle">Workflow</text>
  <text x="987" y="388" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">transitions d'état + invariance (garde)</text>

  <!-- Rangée B -->
  <rect x="112" y="416" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="231" y="438" font-family="Arial" font-size="13" font-weight="600" fill="#FF8533" text-anchor="middle">Lifecycle</text>
  <text x="231" y="458" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">archive / restauration + audit (→ Resource)</text>

  <rect x="364" y="416" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="483" y="438" font-family="Arial" font-size="13" font-weight="600" fill="#FF8533" text-anchor="middle">Relationship</text>
  <text x="483" y="458" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">adhésions groupes (→ Resource)</text>

  <rect x="616" y="416" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="735" y="438" font-family="Arial" font-size="13" font-weight="600" fill="#FF8533" text-anchor="middle">Resource</text>
  <text x="735" y="458" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">CRUD générique via PowerSync (→ dataLayer)</text>

  <rect x="868" y="416" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="987" y="438" font-family="Arial" font-size="13" font-weight="600" fill="#FF8533" text-anchor="middle">Policy</text>
  <text x="987" y="458" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">règles métier pures (cotisation / transaction / versement)</text>

  <!-- Rangée C — extensions -->
  <rect x="112" y="486" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="231" y="508" font-family="Arial" font-size="13" font-weight="600" fill="#B3B3B3" text-anchor="middle">Notification</text>
  <text x="231" y="528" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">façade OneSignal (web + mobile)</text>

  <rect x="364" y="486" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="483" y="508" font-family="Arial" font-size="13" font-weight="600" fill="#B3B3B3" text-anchor="middle">Federation</text>
  <text x="483" y="528" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">multi-org (profondeur illimitée, → Organization)</text>

  <rect x="616" y="486" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="735" y="508" font-family="Arial" font-size="13" font-weight="600" fill="#B3B3B3" text-anchor="middle">Budgets · Cotisation · Giving</text>
  <text x="735" y="528" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">extensions de domaine (lignes budgétaires, cotisations par groupe, dons)</text>

  <rect x="868" y="486" width="238" height="58" rx="8" fill="#282828" stroke="#333333"/>
  <text x="987" y="508" font-family="Arial" font-size="13" font-weight="600" fill="#B3B3B3" text-anchor="middle">Invitation</text>
  <text x="987" y="528" font-family="Arial" font-size="11" fill="#808080" text-anchor="middle">QR / code offline → validation en ligne (multi-modèles)</text>

  <!-- flèches 1b → 1c -->
  <line x1="609" y1="546" x2="609" y2="568" stroke="#FFB800" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── 1c. État & services ── -->
  <rect x="112" y="572" width="486" height="64" rx="10" fill="#212121" stroke="#282828"/>
  <text x="355" y="598" font-family="Arial" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">État — Zustand + React Query</text>
  <text x="355" y="618" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">useLocalStore (repli IndexedDB) · useThemeModeStore · cache mémoire</text>

  <rect x="614" y="572" width="486" height="64" rx="10" fill="#212121" stroke="#282828"/>
  <text x="857" y="598" font-family="Arial" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Services &amp; infrastructure</text>
  <text x="857" y="618" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">Sentry (boot) · OneSignal · cache · services * (event, group, transaction, versement, audit)</text>

  <!-- flèches 1c → 1d -->
  <line x1="355" y1="638" x2="355" y2="664" stroke="#FFB800" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="857" y1="638" x2="857" y2="664" stroke="#FFB800" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── 1d. dataLayer ── -->
  <rect x="112" y="668" width="988" height="64" rx="10" fill="#282828" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="606" y="694" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">dataLayer.ts — couche données unifiée (PowerSync prioritaire, repli IndexedDB)</text>
  <text x="606" y="714" font-family="Arial" font-size="12" fill="#B3B3B3" text-anchor="middle">hooks React (useData…) · exécution CRUD locale immédiate · propagation vers Supabase quand le réseau est dispo</text>

  <!-- flèche 1d → 1e -->
  <line x1="606" y1="734" x2="606" y2="758" stroke="#FFB800" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="752" font-family="Arial" font-size="11.5" fill="#B3B3B3">requêtes SQL (SQLite)</text>

  <!-- ── 1e. PowerSync local ── -->
  <rect x="112" y="762" width="988" height="130" rx="10" fill="#212121" stroke="#282828"/>
  <text x="606" y="790" font-family="Arial" font-size="15" font-weight="700" fill="#FF8533" text-anchor="middle">PowerSync local — cache synchronisé (client-side)</text>
  <text x="606" y="812" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">SQLite local : 31 streams hydratés (org_units, caisses, transactions, events, event_tasks,</text>
  <text x="606" y="830" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">cotisations, members, groups, versements, accounts, budgets, form_*, custom_*, invitations,</text>
  <text x="606" y="848" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">org_family, org_reports, tags…)</text>
  <text x="606" y="874" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">SupabaseConnector (push) · file d'envoi · diagnostics dev (window.__psDb)</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  ZONE 2 — SYNCHRONISATION (colonne droite, x 1214–2336)                -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="1214" y="150" width="1122" height="560" rx="18" fill="none" stroke="#282828" stroke-width="1.5"/>
  <text x="1242" y="182" font-family="Arial" font-size="13" font-weight="700" fill="#FF8533" letter-spacing="2">② SYNCHRONISATION OFFLINE-FIRST (POWER CLOUD)</text>

  <!-- PowerSync Cloud -->
  <rect x="1242" y="204" width="1066" height="120" rx="10" fill="#212121" stroke="#282828"/>
  <text x="1775" y="232" font-family="Arial" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">PowerSync Cloud (édition 3 — multi-organisation)</text>
  <text x="1775" y="254" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">Relay Supabase → streams · filtre : org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())</text>
  <text x="1775" y="272" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">Tableaux de liaison sans org_id → filtre transitive sans alias (group_memberships, event_budgets, budget_lines…)</text>
  <text x="1775" y="294" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">streams globaux (categories, tags) : auto_subscribe, sans filtre</text>

  <!-- flèche client → cloud -->
  <path d="M 1100,827 L 1170,827 L 1170,264 L 1234,264" fill="none" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="1186" y="812" font-family="Arial" font-size="12" fill="#FFB800" text-anchor="middle">CRUD + sync (réseau dispo)</text>

  <!-- flèche cloud → supabase -->
  <line x1="1775" y1="326" x2="1775" y2="364" stroke="#FFB800" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1790" y="352" font-family="Arial" font-size="12" fill="#B3B3B3">récupération des streams</text>

  <!-- Supabase -->
  <rect x="1242" y="368" width="1066" height="150" rx="10" fill="#212121" stroke="#282828"/>
  <text x="1775" y="396" font-family="Arial" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Supabase — PostgreSQL + Auth + Storage</text>
  <text x="1775" y="418" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">RLS sur toutes les tables business · org_family (vue récursive) · 93 migrations additif</text>
  <text x="1775" y="440" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">Edge Functions : signup (crée le profil) · login · create_org · onesignal-notify</text>
  <text x="1775" y="462" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">fix initplan_uid() : le SubPlan préparé RLS lis request.jwt.claims (clé parent) via une fonction STABLE</text>
  <text x="1775" y="484" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">sinon 403 42501 (42501) malgré l'adhésion de l'org (migration 20261012000001)</text>

  <!-- flèches vers les sorties -->
  <line x1="1540" y1="518" x2="1540" y2="548" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <line x1="1990" y1="518" x2="1990" y2="548" stroke="#808080" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="1556" y="540" font-family="Arial" font-size="12" fill="#B3B3B3">auth (JWT) + storage</text>
  <text x="2006" y="540" font-family="Arial" font-size="12" fill="#808080">serving SPA statique</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  ZONE 3 — SORTIES (2 colonnes au bas droit)                             -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="1214" y="740" width="1122" height="350" rx="18" fill="none" stroke="#282828" stroke-width="1.5"/>
  <text x="1242" y="772" font-family="Arial" font-size="13" font-weight="700" fill="#FF8533" letter-spacing="2">③ DÉMULTIPLICATION &amp; QUALITÉ</text>

  <!-- Android -->
  <rect x="1242" y="792" width="520" height="150" rx="10" fill="#212121" stroke="#FF6B00" stroke-width="1.2"/>
  <text x="1502" y="824" font-family="Arial" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle">Mobile — Android (Capacitor 6)</text>
  <text x="1502" y="848" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">APK signé v1+v2+v3 · minSdk 21 / targetSdk 34</text>
  <text x="1502" y="868" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">CI GitHub (android-debug.yml, lumina-android.yml)</text>
  <text x="1502" y="888" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">Maestro : smoke test mobile · pnpm build:cap + cap sync</text>
  <text x="1502" y="906" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">OneSignal push (Capacitor push-notifications)</text>

  <!-- Web -->
  <rect x="1782" y="792" width="498" height="150" rx="10" fill="#212121" stroke="#282828"/>
  <text x="2031" y="824" font-family="Arial" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Web — Vercel / Render</text>
  <text x="2031" y="848" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">SPA statique dist/ · rewrites → index.html</text>
  <text x="2031" y="868" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">serve-spa.mjs : fallback SPA + cache + gzip (Render)</text>
  <text x="2031" y="888" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">100 % front-first (Nitro supprimé le 2026-09-30)</text>
  <text x="2031" y="906" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">plus de route serveur — dataLayer + services côté navigateur</text>

  <!-- Qualité (full width sous les 2) -->
  <rect x="1242" y="960" width="1038" height="110" rx="10" fill="#212121" stroke="#282828"/>
  <text x="1761" y="988" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Qualité — 574 tests · CI GitHub (lint + tsc + vitest + build) · Cypress 24 specs · Playwright · Maestro</text>
  <text x="1761" y="1010" font-family="Arial" font-size="13" fill="#B3B3B3" text-anchor="middle">E2E ciblés : cloud-sync · cross-tenant (fuite RLS) · persistence · performance-batch · org-reports · calendar · theme-modes</text>
  <text x="1761" y="1030" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">Vitest 574 tests (18 fichiers) · garde d'architecture no-cross-imports · spécifications RLS en live via le MCP Supabase</text>
  <text x="1761" y="1050" font-family="Arial" font-size="12" fill="#808080" text-anchor="middle">graphify-out/ : graphe de connaissance du codebase (AST, 0 coût API) — à resynchroniser après modification de code</text>

  <!-- Légende (bas gauche) -->
  <rect x="64" y="1080" width="1090" height="110" rx="10" fill="#1A1A1A" stroke="#282828"/>
  <text x="92" y="1108" font-family="Arial" font-size="13" font-weight="700" fill="#B3B3B3" letter-spacing="1">LÉGENDE</text>
  <line x1="92" y1="1130" x2="160" y2="1130" stroke="#FF6B00" stroke-width="2.5"/>
  <text x="172" y="1134" font-family="Arial" font-size="12.5" fill="#B3B3B3">flux principal (données / contrôle)</text>
  <line x1="470" y1="1130" x2="538" y2="1130" stroke="#808080" stroke-width="2"/>
  <text x="550" y="1134" font-family="Arial" font-size="12.5" fill="#B3B3B3">flux secondaire (auth / static)</text>
  <rect x="790" y="1118" width="20" height="20" rx="4" fill="#282828" stroke="#FF6B00" stroke-width="1.2"/>
  <text x="820" y="1134" font-family="Arial" font-size="12.5" fill="#B3B3B3">composant clé (point d'entrée / démultiplication)</text>
  <text x="92" y="1160" font-family="Arial" font-size="12" fill="#808080">Zone ① = client (tout ce qui tourne dans le navigateur / l'app) · Zone ② = couche de sync offline-first · Zone ③ = sorties et qualité</text>
  <text x="92" y="1178" font-family="Arial" font-size="12" fill="#808080">L'interface est 100 % front-first : aucune route serveur — les données passent par PowerSync + Supabase avec RLS sur chaque table business.</text>
</svg>
