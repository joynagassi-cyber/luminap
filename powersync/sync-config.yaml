# Adds YAML Schema support for VSCode users with the YAML extension installed. This enables features like validation and autocompletion based on the provided schema.
# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json

# See https://docs.powersync.com/sync/advanced/compatibility
config:
  edition: 3

# Define Sync Streams to control which data is synced to each user
streams:
  # Global data - same for all users
  categories:
    auto_subscribe: true
    query: SELECT * FROM transaction_categories

  churches:
    auto_subscribe: true
    query: SELECT * FROM churches

  # User-specific data
  profiles:
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE id = auth.user_id()

  user_roles:
    auto_subscribe: true
    query: SELECT * FROM user_roles WHERE user_id = auth.user_id()

  # Church-specific data (for multi-church support)
  church_members:
    auto_subscribe: true
    query: SELECT * FROM church_members WHERE church_id IN (SELECT church_id FROM user_churches WHERE user_id = auth.user_id())

  members:
    auto_subscribe: true
    query: SELECT * FROM members WHERE church_id IN (SELECT church_id FROM user_churches WHERE user_id = auth.user_id())

  transactions:
    auto_subscribe: true
    query: SELECT * FROM transactions WHERE church_id IN (SELECT church_id FROM user_churches WHERE user_id = auth.user_id())

  finance_transactions:
    auto_subscribe: true
    query: SELECT * FROM finance_transactions WHERE church_id IN (SELECT church_id FROM user_churches WHERE user_id = auth.user_id())

  events:
    auto_subscribe: true
    query: SELECT * FROM events WHERE church_id IN (SELECT church_id FROM user_churches WHERE user_id = auth.user_id())

  notifications:
    auto_subscribe: true
    query: SELECT * FROM notifications WHERE user_id = auth.user_id()

  # Development: sync all tables (remove in production)
  # Uncomment below to sync everything during development
  # all_tables:
  #   auto_subscribe: true
  #   query: SELECT * FROM "%"
