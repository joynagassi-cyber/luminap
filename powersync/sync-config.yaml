# Lumina — PowerSync Sync Streams (édition 3, multi-organisation).
#
# Conventions
#   - `auth.uid()`          : Supabase user ID (UUID) du stream requesté par le
#                            client PowerSync. Côté service, il est résolu
#                            contre `profiles.id` pour récupérer l'organisation
#                            de l'utilisateur.
#   - `auth.email()`        : email du profil (fallback : user email).
#   - `auto_subscribe: true`: le client s'abonne automatiquement au stream à
#                            l'initialisation (utile pour les streams globaux
#                            ou partagés par toute l'organisation).
#
# Pattern de filtrage par organisation
#   Pour toute table qui porte une colonne `org_id` (text, pas uuid), le
#   filtre est :
#       WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())
#   Cela garantit qu'un utilisateur connecté ne voit QUE les données de son
#   propre organisation — sans fuite cross-org.
#
# Pattern pour les tables LIAISON sans `org_id`
#   `group_memberships`     : liée à `groups` (a `org_id`) → filtre par group_id
#   `event_budgets`         : liée à `events`  (a `org_id`) → filtre par event_id
#   `budget_lines`          : liée à `event_budgets` → filtre transitif
#   `custom_field_values`   : liée à `custom_field_definitions` (a `org_id`)
#
# Les streams GLOBAUX (mêmes pour tous les utilisateurs, aucune col
# organisationnelle) restent en `auto_subscribe: true` sans filtre.

config:
  edition: 3

streams:
  # ── Données globales / partagées ────────────────────────────────────────
  categories:
    auto_subscribe: true
    query: SELECT * FROM categories

  org_units:
    auto_subscribe: true
    query: SELECT * FROM org_units

  caisses:
    auto_subscribe: true
    query: SELECT * FROM caisses

  # ── Socle multi-org (Vague 1) ──────────────────────────────────────────
  # Les memberships multi-org sont créés côté client (pas auto_subscribe) :
  # l'UI en a besoin pour afficher les rôles / orgs multiples de l'user.
  org_memberships:
    auto_subscribe: false
    query: SELECT * FROM org_memberships
           WHERE user_id = auth.uid()
              OR org_id IN (SELECT org_id FROM profiles WHERE id = auth.uid())

  # ── Profil de l'utilisateur connecté ───────────────────────────────────
  profiles:
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE email = auth.email()

  # ── Données de l'organisation de l'utilisateur connecté ───────────────
  # Double-scope (Vague 1, réversible) : tant que le backfill 1:1 est exact,
  # `legacy ∪ memberships` = l'ancien jeu de données pour un user 1-org.
  # Modèle à répliquer aux 22 autres streams en Étape 2.
  transactions:
    auto_subscribe: true
    query: SELECT * FROM transactions WHERE org_id IN (
      SELECT org_id FROM org_memberships
      WHERE user_id = auth.uid() AND status IN ('ACTIVE','PENDING')
      UNION
      SELECT org_id FROM profiles WHERE id = auth.uid()
    )

  events:
    auto_subscribe: true
    query: SELECT * FROM events WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  # Tâches & sous-tâches d'un événement (Phase 1 Feature 1 Calendrier,
  # migration 20261003000001). Scoping org identique à `events` ; l'UI
  # (EventTasks.tsx via useEventTasks) crée le stream explicitement.
  event_tasks:
    auto_subscribe: false
    query: SELECT * FROM event_tasks
           WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  cotisations:
    auto_subscribe: true
    query: SELECT * FROM cotisations WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  members:
    auto_subscribe: true
    query: SELECT * FROM members WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  groups:
    auto_subscribe: true
    query: SELECT * FROM groups WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  versements:
    auto_subscribe: true
    query: SELECT * FROM versements WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  notifications:
    auto_subscribe: true
    query: SELECT * FROM notifications WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  # Modèle canonique de comptes
  accounts:
    auto_subscribe: true
    query: SELECT * FROM accounts WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  # Liaisons sans org_id direct → filtre transitif via le parent
  group_memberships:
    auto_subscribe: true
    query: SELECT gm.* FROM group_memberships gm
           JOIN groups g ON g.id = gm.group_id
           WHERE g.org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  event_budgets:
    auto_subscribe: true
    query: SELECT eb.* FROM event_budgets eb
           JOIN events e ON e.id = eb.event_id
           WHERE e.org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  budget_lines:
    auto_subscribe: true
    query: SELECT bl.* FROM budget_lines bl
           JOIN event_budgets eb ON eb.id = bl.event_budget_id
           JOIN events e ON e.id = eb.event_id
           WHERE e.org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  custom_field_values:
    auto_subscribe: true
    query: SELECT cv.* FROM custom_field_values cv
           JOIN custom_field_definitions cfd ON cfd.id = cv.custom_field_definition_id
           WHERE cfd.org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  # Formulaires
  form_definitions:
    auto_subscribe: true
    query: SELECT * FROM form_definitions WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  form_submissions:
    auto_subscribe: true
    query: SELECT * FROM form_submissions WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  # Champs personnalisés
  custom_field_definitions:
    auto_subscribe: true
    query: SELECT * FROM custom_field_definitions WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  # ── Invitations ─────────────────────────────────────────────────────────
  # Les invitations sont créées par un admin et validées par un utilisateur.
  # On synchronise :
  #   - les invitations émises par l'organisation de l'utilisateur courant
  #     (l'admin émetteur voit les siennes)
  #   - les invitations réclamées par le profil de l'utilisateur courant
  #     (le membre invité voit celles qu'il a réclamées)
  # Ce n'est PAS un stream auto_subscribe : un utilisateur ne lit que ces
  # deux vues, pas tout ce que tout le monde a émis. Le client (InvitationEmit /
  # InvitationClaim / InvitationManage) crée explicitement le stream pour
  # chaque vue.
  invitations:
    auto_subscribe: false
    query: SELECT * FROM invitations WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  invitation_claims:
    auto_subscribe: false
    query: SELECT * FROM invitation_claims
           WHERE invitation_id IN (SELECT id FROM invitations
                                   WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid()))

  # ── Administration centrale multi-org ──────────────────────────────────
  organizations:
    auto_subscribe: false
    # Phase 1 Feature 2 : famille complète (profondeur illimitée) via
    # `org_family` (vue closure transitive, migration 20261003000003).
    # Un admin central voit les orgs qu'il gère (org_admins) ; une annexe
    # voit sa famille complète (ascendants + descendants) pour
    # recevoir/envoyer des rapports. Le stream est créé explicitement côté
    # client (CentralAdmin / Federation / Rapports).
    query: SELECT o.id, o.name, o.type, o.status, o.parent_org_id,
                  o.suspended_at, o.suspended_by,
                  o.archived_at, o.archived_by, o.archive_reason,
                  o.created_at, o.updated_at
           FROM organizations o
           WHERE o.id IN (
                  SELECT org_id FROM public.org_family
                  WHERE ancestor = (SELECT org_id FROM public.profiles WHERE id = auth.uid())
                  UNION
                  SELECT org_id FROM public.org_admins WHERE admin_profile_id = auth.uid()
                  UNION
                  SELECT org_id FROM public.profiles WHERE id = auth.uid()
                )

  org_admins:
    auto_subscribe: false
    query: SELECT * FROM org_admins
           WHERE admin_profile_id = auth.uid()
              OR org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  # ── Rapports inter-organisations (Phase 1 Feature 2) ────────────────────
  # Un user lit les rapports (a) émis par son org (from_org_id = son org)
  # ET (b) reçus par son org (to_org_id = son org). Pas auto_subscribe :
  # le client crée explicitement le stream (page d'émission / page réception).
  org_reports:
    auto_subscribe: false
    query: SELECT * FROM org_reports
           WHERE from_org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())
              OR to_org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())

  # ── Modèle agnostique (Vague 2) : grants + tags ─────────────────────────
  # Streams créés explicitement côté client ; le filtrage fort passe par
  # `canAccess` (Vague 2.4), le scoping RLS reste `is_org_member`.
  grants:
    auto_subscribe: false
    query: SELECT * FROM grants
           WHERE subject_id = auth.uid()::text
              OR subject_type = 'tag' AND subject_id IN
                 (SELECT ta.tag_id::text FROM tag_assignments ta
                  WHERE ta.user_id = auth.uid())

  tags:
    auto_subscribe: false
    query: SELECT * FROM tags
           WHERE org_id = (SELECT org_id FROM profiles WHERE id = auth.uid())
              OR org_id IN (SELECT org_id FROM org_memberships
                            WHERE user_id = auth.uid()
                              AND status IN ('ACTIVE','PENDING'))

  tag_assignments:
    auto_subscribe: false
    query: SELECT * FROM tag_assignments
           WHERE user_id = auth.uid()
