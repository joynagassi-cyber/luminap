# Adds YAML Schema support for VSCode users with the YAML extension installed. This enables features like validation and autocompletion based on the provided schema.
# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json

config:
  edition: 3

streams:
  # Global data - same for all users
  categories:
    auto_subscribe: true
    query: SELECT * FROM categories

  org_units:
    auto_subscribe: true
    query: SELECT * FROM org_units

  caisses:
    auto_subscribe: true
    query: SELECT * FROM caisses

  # User-specific data
  profiles:
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE email = auth.email()

  # Organization data (for single org setup)
  transactions:
    auto_subscribe: true
    query: SELECT * FROM transactions WHERE org_id = 'org-1'

  events:
    auto_subscribe: true
    query: SELECT * FROM events WHERE org_id = 'org-1'

  cotisations:
    auto_subscribe: true
    query: SELECT * FROM cotisations WHERE org_id = 'org-1'

  members:
    auto_subscribe: true
    query: SELECT * FROM members WHERE org_id = 'org-1'

  groups:
    auto_subscribe: true
    query: SELECT * FROM groups WHERE org_id = 'org-1'

  versements:
    auto_subscribe: true
    query: SELECT * FROM versements WHERE org_id = 'org-1'

  notifications:
    auto_subscribe: true
    query: SELECT * FROM notifications WHERE org_id = 'org-1'

  # Canonical account model
  accounts:
    auto_subscribe: true
    query: SELECT * FROM accounts WHERE org_id = 'org-1'

  # Group membership (linked to groups/members, no org_id column)
  group_memberships:
    auto_subscribe: true
    query: SELECT * FROM group_memberships

  # Event budget (linked to events, no org_id column)
  event_budgets:
    auto_subscribe: true
    query: SELECT * FROM event_budgets

  budget_lines:
    auto_subscribe: true
    query: SELECT * FROM budget_lines

  # Forms
  form_definitions:
    auto_subscribe: true
    query: SELECT * FROM form_definitions WHERE org_id = 'org-1'

  form_submissions:
    auto_subscribe: true
    query: SELECT * FROM form_submissions WHERE org_id = 'org-1'

  # Custom fields
  custom_field_definitions:
    auto_subscribe: true
    query: SELECT * FROM custom_field_definitions WHERE org_id = 'org-1'

  custom_field_values:
    auto_subscribe: true
    query: SELECT * FROM custom_field_values

  # Reports
  report_definitions:
    auto_subscribe: true
    query: SELECT * FROM report_definitions WHERE org_id = 'org-1'
