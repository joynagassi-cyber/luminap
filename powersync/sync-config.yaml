# Lumina — PowerSync Sync Streams (édition 3, multi-organisation).
#
# Conventions
#   - `auth.user_id()`    : Supabase user ID (UUID) ; scope du stream via le
#                           JWT `sub`. Côté service, il est résolu contre
#                           `profiles.id` pour récupérer l'organisation.
#   - `auto_subscribe: true`: le client s'abonne automatiquement au stream à
#                             l'initialisation (utile pour les streams globaux
#                             ou partagés par toute l'organisation).
#
# Pattern de filtrage par organisation (double-scope, « Étape 2 »)
#   Pour toute table qui porte une colonne `org_id` (text, pas uuid), le
#   filtre couvre TOUTES les organisations de l'utilisateur :
#       WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
#          OR org_id IN (SELECT org_id FROM org_memberships
#                         WHERE user_id = auth.user_id() AND status = 'ACTIVE')
#          OR org_id IN (SELECT org_id FROM org_memberships
#                         WHERE user_id = auth.user_id() AND status = 'PENDING')
#   `profiles` ne porte qu'UNE organisation (1 profil par utilisateur) :
#   ne filtrer que par lui (ancien pattern) rendait les organisations
#   secondaires invisibles — après un changement d'organisation, l'app
#   restait vide, en ligne comme hors ligne, PowerSync étant l'unique
#   source de données. La forme à branches `OR` reprend celle, éprouvée,
#   du stream `profiles` ci-dessous. Exceptions assumées : `invitations`
#   et `invitation_claims` (rôles admin via memberships ACTIVE),
#   `grants`, `org_administered`, `tag_assignments` (scope propre).
#
# Pattern pour les tables historiquement « liaison sans org_id »
#   `group_memberships`, `event_budgets`, `budget_lines`, `custom_field_values`
#   étaient filtrées par JOIN sur le parent ; `org_id` a depuis été
#   DÉNORMALISÉ sur ces tables (R89.b) et leur stream utilise le filtre direct
#   `org_id IN (…)` ci-dessus — le JOIN avait été abandonné car PowerSync ne
#   peut pas clé la partition sur une colonne absente de la ligne (1 bucket par
#   ligne → plafond 1000, `PSYNC_S2305`).
#   Aucun alias sur la table source (pas de `gm`, `eb`, `bl`, `cv`) :
#   PowerSync sync le source row sous l'alias si on en met, ce qui casse les
#   requêtes client qui cherchent la table par son vrai nom.
#
# Les streams GLOBAUX (mêmes pour tous les utilisateurs, aucune col
# organisationnelle) restent en `auto_subscribe: true` sans filtre.

config:
  edition: 3

streams:
  # ── Données d'organisation ─────────────────────────────────────────────
  # categories / org_units / caisses portent toutes un `org_id` : elles
  # doivent être filtrées par organisation, comme les autres streams.
  # (Corrigé le 2026-10-22 : ces 3 streams étaient `SELECT *` sans filtre,
  # donc chaque utilisateur synchronisait les catégories, unités internes et
  # caisses de TOUTES les organisations.)
  categories:
    auto_subscribe: true
    query: |
      SELECT * FROM categories
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  org_units:
    auto_subscribe: true
    query: |
      SELECT * FROM org_units
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  caisses:
    auto_subscribe: true
    query: |
      SELECT * FROM caisses
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # ── Socle multi-org (Vague 1) ──────────────────────────────────────────
  # Les memberships multi-org sont créés côté client (pas auto_subscribe) :
  # l'UI en a besoin pour afficher les rôles / orgs multiples de l'user.
  org_memberships:
    auto_subscribe: false
    query: |
      SELECT * FROM org_memberships
      WHERE user_id = auth.user_id()
         OR org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # ── Profils visibles par l'utilisateur connecté (R80) ──────────────────
  # Miroir EXACT de la politique RLS `profiles_select`
  #   ((initplan_uid() = id) OR is_org_member(initplan_uid(), org_id))
  # où `is_org_member(u, org)` = appartenance via `profiles.org_id` OU
  # `org_memberships` (ACTIVE/PENDING) OU `org_admins` (ACTIVE), avec les
  # sentinelles `__no_org__` / `no-org` / vide EXCLUES.
  # Sans élargissement, la colonne « Soumetteur » de /forms affichait l'UUID
  # brut pour tout membre autre que soi (défaut R80).
  profiles:
    auto_subscribe: true
    query: |
      SELECT * FROM profiles
      WHERE id = auth.user_id()
         OR org_id IN (
              SELECT org_id FROM org_memberships
               WHERE user_id = auth.user_id()
                 AND status = 'ACTIVE')
         OR org_id IN (
              SELECT org_id FROM org_memberships
               WHERE user_id = auth.user_id()
                 AND status = 'PENDING')
         OR org_id IN (
              SELECT org_id FROM org_admins
               WHERE admin_profile_id = auth.user_id()
                 AND status = 'ACTIVE')
         OR org_id IN (
              SELECT org_id FROM profiles
               WHERE id = auth.user_id()
                 AND org_id <> '__no_org__'
                 AND org_id <> 'no-org'
                 AND org_id <> '')

  # ── Données des organisations de l'utilisateur connecté ───────────────
  # Double-scope généralisé (« Étape 2 », cf. en-tête) : `profiles` (org
  # primaire) ∪ `org_memberships` ACTIVE/PENDING. Pour un utilisateur
  # mono-org avec le backfill 1:1, le jeu de données est inchangé.
  transactions:
    auto_subscribe: true
    query: |
      SELECT * FROM transactions
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  events:
    auto_subscribe: true
    query: |
      SELECT * FROM events
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # Tâches & sous-tâches d'un événement (Phase 1 Feature 1 Calendrier,
  # migration 20261003000001). Scoping org identique à `events` ; l'UI
  # (EventTasks.tsx via useEventTasks) crée le stream explicitement.
  event_tasks:
    auto_subscribe: false
    query: |
      SELECT * FROM event_tasks
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  cotisations:
    auto_subscribe: true
    query: |
      SELECT * FROM cotisations
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  members:
    auto_subscribe: true
    query: |
      SELECT * FROM members
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  groups:
    auto_subscribe: true
    query: |
      SELECT * FROM groups
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  versements:
    auto_subscribe: true
    query: |
      SELECT * FROM versements
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  notifications:
    auto_subscribe: true
    query: |
      SELECT * FROM notifications
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # Modèle canonique de comptes
  accounts:
    auto_subscribe: true
    query: |
      SELECT * FROM accounts
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # Liaisons sans org_id direct → filtre transitif via le parent
  # (Aucun alias sur la table source : PowerSync renommerait sinon la table
  # sync côté client, qui s'appelle group_memberships côté SDK.)
  group_memberships:
    auto_subscribe: true
    query: |
      SELECT * FROM group_memberships
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  event_budgets:
    auto_subscribe: true
    query: |
      SELECT * FROM event_budgets
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  budget_lines:
    auto_subscribe: true
    query: |
      SELECT * FROM budget_lines
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  custom_field_values:
    auto_subscribe: true
    query: |
      SELECT * FROM custom_field_values
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # Formulaires
  form_definitions:
    auto_subscribe: true
    query: |
      SELECT * FROM form_definitions
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  form_submissions:
    auto_subscribe: true
    query: |
      SELECT * FROM form_submissions
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # Champs personnalisés
  custom_field_definitions:
    auto_subscribe: true
    query: |
      SELECT * FROM custom_field_definitions
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # Définitions de rapports (/reports, /report-builder). Scopées à
  # l'organisation de l'utilisateur, comme `transactions`. Sans ce stream, la
  # table locale restait vide et les rapports d'une autre session n'étaient
  # jamais reçus (R184/#317).
  report_definitions:
    auto_subscribe: true
    query: |
      SELECT * FROM report_definitions
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # ── Invitations ─────────────────────────────────────────────────────────
  # Les invitations sont créées par un admin et validées par un utilisateur.
  # On synchronise :
  #   - les invitations émises par l'organisation de l'utilisateur courant
  #     (l'admin émetteur voit les siennes)
  #   - les invitations réclamées par le profil de l'utilisateur courant
  #     (le membre invité voit celles qu'il a réclamées)
  # Ce n'est PAS un stream auto_subscribe : un utilisateur ne lit que ces
  # deux vues, pas tout ce que tout le monde a émis. Le client (InvitationEmit /
  # InvitationClaim / InvitationManage) crée explicitement le stream pour
  # chaque vue.
  invitations:
    auto_subscribe: false
    query: |
      SELECT * FROM invitations
      WHERE org_id IN (
        SELECT org_id FROM org_memberships
        WHERE user_id = auth.user_id() AND status = 'ACTIVE'
          AND (role = 'PASTEUR_PRINCIPAL' OR role = 'ANCIEN' OR role = 'TREASURIER')
      )
      OR org_id IN (
        SELECT org_id FROM profiles
        WHERE id = auth.user_id()
          AND (role = 'PASTEUR_PRINCIPAL' OR role = 'ANCIEN' OR role = 'TREASURIER')
      )

  invitation_claims:
    auto_subscribe: false
    query: |
      SELECT * FROM invitation_claims
      WHERE invitation_id IN (
        SELECT id FROM invitations
        WHERE org_id IN (
          SELECT org_id FROM org_memberships
          WHERE user_id = auth.user_id() AND status = 'ACTIVE'
            AND (role = 'PASTEUR_PRINCIPAL' OR role = 'ANCIEN' OR role = 'TREASURIER')
        )
        OR org_id IN (
          SELECT org_id FROM profiles
          WHERE id = auth.user_id()
            AND (role = 'PASTEUR_PRINCIPAL' OR role = 'ANCIEN' OR role = 'TREASURIER')
        )
      )

  # ── Administration centrale multi-org ──────────────────────────────────
  # L'union des 3 vues (famille + admin + propre org) est impossible dans un
  # seul stream PowerSync (UNION de 2+ SELECT rejetés par le validateur).
  # Chaque vue est un stream séparé ; le client les crée explicitement.
  org_families:
    auto_subscribe: false
    query: |
      SELECT o.id, o.name, o.logo_url, o.type, o.status, o.parent_org_id,
             o.suspended_at, o.suspended_by,
             o.archived_at, o.archived_by, o.archive_reason,
             o.created_at, o.updated_at
      FROM organizations o
      WHERE o.id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR o.id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR o.id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # Robustesse PSYNC_S2305 : ne synchroniser QUE les grants ACTIFS.
  # Un grant révoqué (status = 'REVOKED') n'ouvre aucun droit (la RLS ne lit
  # que les grants ACTIVE) et l'UI le retire déjà de la liste
  # (CentralAdmin.handleRevoke). Les inclure gonflait la sous-requête de
  # paramètre : sur un compte ayant accumulé des centaines de grants, la limite
  # PowerSync de 1000 résultats est franchie → la synchronisation échoue
  # entièrement (bannière « Synchronisation indisponible », aucune donnée).
  org_administered:
    auto_subscribe: false
    query: |
      SELECT id, name, type, status, parent_org_id, logo_url,
             suspended_at, suspended_by,
             archived_at, archived_by, archive_reason,
             created_at, updated_at
      FROM organizations
      WHERE id IN (
        SELECT org_id FROM org_admins
        WHERE admin_profile_id = auth.user_id()
          AND status = 'ACTIVE'
      )

  org_owned:
    auto_subscribe: false
    query: |
      SELECT id, name, type, status, parent_org_id, logo_url,
             suspended_at, suspended_by,
             archived_at, archived_by, archive_reason,
             created_at, updated_at
      FROM organizations
      WHERE id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # Back-compat : les streams qui référenceaient le stream "organizations"
  # (CentralAdmin / Federation / Rapports) utilisent l'union des 3 streams
  # ci-dessus via les composants UI (voir src/capabilities/federation/*).
  org_admins:
    auto_subscribe: false
    query: |
      SELECT * FROM org_admins
      WHERE admin_profile_id = auth.user_id()
         OR org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # ── Rapports inter-organisations (Phase 1 Feature 2) ────────────────────
  # Un user lit les rapports (a) émis par son org (from_org_id = son org)
  # ET (b) reçus par son org (to_org_id = son org). Pas auto_subscribe :
  # le client crée explicitement le stream (page d'émission / page réception).
  org_reports:
    auto_subscribe: false
    query: |
      SELECT * FROM org_reports
      WHERE from_org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR from_org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR from_org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')
         OR to_org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR to_org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR to_org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # ── Modèle agnostique (Vague 2) : grants + tags ─────────────────────────
  # Streams créés explicitement côté client ; le filtrage fort passe par
  # `canAccess` (Vague 2.4), le scoping RLS reste `is_org_member`.
  # Cloisonnement par org (migration 20261027000010) : un grant n'est
  # synchronisé que pour les organisations de l'utilisateur.
  grants:
    auto_subscribe: false
    query: |
      SELECT * FROM grants
      WHERE subject_id = auth.user_id()
         OR org_id IN (
              SELECT org_id FROM org_memberships
              WHERE user_id = auth.user_id() AND status = 'ACTIVE')

  tags:
    auto_subscribe: false
    # Simple scoping : le tag est synchronisé pour l'organisation de l'user
    # courant (via profiles). L'UNION des orgs ACTIVE/PENDING dans memberships
    # est exprimable par le client si nécessaire (canAccess), pas par PowerSync.
    query: |
      SELECT * FROM tags
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # Réglages par organisation (PR8 maker-checker, PR13 gel de période).
  # auto_subscribe : les réglages sont peu nombreux et nécessaires dès le
  # démarrage (l'écran de transaction doit connaître le gel de période).
  org_settings:
    auto_subscribe: true
    query: |
      SELECT * FROM org_settings
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  tag_assignments:
    auto_subscribe: false
    query: SELECT * FROM tag_assignments WHERE user_id = auth.user_id()

  # Pièces justificatives (reçus) attachées à une transaction — PR9.
  # Borné à l'organisation de l'utilisateur connecté (comme `transactions`).
  # `auto_subscribe` : les justificatifs sont peu nombreux et nécessaires dès
  # l'ouverture du détail d'une transaction (aperçu hors ligne).
  transaction_attachments:
    auto_subscribe: true
    query: |
      SELECT * FROM transaction_attachments
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  # ── Tables du schéma client SANS stream (défaut mesuré 2026-11-01) ───────
  # Ces 9 tables figurent dans `src/lib/powersync/schema.ts` et sont lues via
  # le SQL LOCAL (`useQuery` / `db.execute`) MAIS n'étaient synchronisées par
  # AUCUN stream : leur réplique restait donc vide (lecture locale = vide ;
  # `/trace`, `/budgets`, `/giving`, corbeille `documents`) et un appareil neuf
  # ne les recevait jamais. Vérifié contre la config DÉPLOYÉE
  # (`powersync fetch status`). Toutes portent `org_id` (vérifié en base) →
  # filtre direct éprouvé (cf. R89.b), pas de JOIN.
  audit_entries:
    auto_subscribe: true
    query: |
      SELECT * FROM audit_entries
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  documents:
    auto_subscribe: true
    query: |
      SELECT * FROM documents
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  org_budgets:
    auto_subscribe: true
    query: |
      SELECT * FROM org_budgets
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  org_budget_lines:
    auto_subscribe: true
    query: |
      SELECT * FROM org_budget_lines
      WHERE org_id IN (SELECT org_id FROM profiles WHERE id = auth.user_id())
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'ACTIVE')
         OR org_id IN (SELECT org_id FROM org_memberships WHERE user_id = auth.user_id() AND status = 'PENDING')

  giving_donors:
    auto_subscribe: true
    query: |
