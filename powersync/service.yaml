# Adds YAML Schema support for VSCode users with the YAML extension installed. This enables features like validation and autocompletion based on the provided schema.
# yaml-language-server: $schema=https://unpkg.com/@powersync/cli-schemas@latest/json-schema/service-config.json

# PowerSync Cloud config - Lumina Church Management
_type: cloud

# Instance name
name: lumina

# Deployment region - MUST match existing instance (eu)
region: eu

# Replication connection to Supabase
replication:
  connections:
    - type: postgresql
      # Supabase uses username: postgres.[project-ref]
      uri: postgresql://postgres.vvcdmqpbwfyhkzalwdli:fUF6s8U678w6ct1a@db.vvcdmqpbwfyhkzalwdli.supabase.co:5432/postgres
      password:
        secret: !env PS_DATABASE_PASSWORD
      sslmode: verify-full

# Client authentication using Supabase JWT
client_auth:
  supabase: true
  # Auto-detects JWKS URL from Supabase project
