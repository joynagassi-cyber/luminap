# PowerSync Cloud config - Lumina Church Management
# yaml-language-server: $schema=https://unpkg.com/@powersync/cli-schemas@latest/json-schema/service-config.json
#
# SOURCE DE VÉRITÉ UNIQUE du service config Cloud (l'ancien dump
# `service-fetched.yaml` a été supprimé : il dupliquait ce fichier et
# divergeait). `powersync deploy service-config` déploie ce contenu.
# Le mot de passe Supabase est géré par le vault Cloud via `secret_ref`.
#
# ⚠️ Instance = 6a9dd96302481fb31b945823 (cli.yaml), nom "Production", région eu.

_type: cloud
name: Production
region: eu

# Replication connection to Supabase.
#
# ⚠️ NE PAS revenir à `username: postgres` + `secret_ref: default_password` :
# cette combinaison pointe vers le mot de passe `postgres` (rotaté côté
# Supabase) et a causé une panne de réplication (R80/R111). L'instance
# Production est approvisionnée par l'intégration Supabase, qui crée un rôle
# de réplication dédié et un secret vault nommé d'après le projet. Ces
# valeurs proviennent de `powersync pull instance` sur l'instance qui
# fonctionne ; elles doivent être conservées telles quelles.
replication:
  connections:
    - type: postgresql
      password:
        secret_ref: supabase_6ae28a41b82cab873076dfc9_password
      hostname: db.hhgovvrnalibhgpakswi.supabase.co
      port: 5432
      database: postgres
      username: powersync_28d1d97617993b66d4ee0a3b
      id: default
      sslmode: verify-full

# Client authentication using Supabase JWT.
# L'authentification passe par le JWKS public du projet (clés asymétriques) —
# pas par le secret JWT legacy, qui n'existe pas dans le vault de cette
# instance. Conforme à `powersync pull instance`.
client_auth:
  supabase: true
  jwks_uri: https://hhgovvrnalibhgpakswi.supabase.co/auth/v1/.well-known/jwks.json
  jwks:
    keys: []
  additional_audiences: []
  allow_temporary_tokens: true
