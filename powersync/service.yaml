# PowerSync Cloud config - Lumina Church Management
# yaml-language-server: $schema=https://unpkg.com/@powersync/cli-schemas@latest/json-schema/service-config.json
#
# SOURCE DE VÉRITÉ UNIQUE du service config Cloud (l'ancien dump
# `service-fetched.yaml` a été supprimé : il dupliquait ce fichier et
# divergeait). `powersync deploy service-config` déploie ce contenu.
# Le mot de passe Supabase est géré par le vault Cloud via `secret_ref`.
#
# ⚠️ Instance = 6a9dd96302481fb31b945823 (cli.yaml), nom "Production", région eu.

_type: cloud
name: Production
region: eu

# Replication connection to Supabase
replication:
  connections:
    - type: postgresql
      uri: postgresql://postgres@db.hhgovvrnalibhgpakswi.supabase.co:5432/postgres
      password:
        secret_ref: default_password
      hostname: db.hhgovvrnalibhgpakswi.supabase.co
      port: 5432
      database: postgres
      username: postgres
      name: Default
      tag: default
      sslmode: verify-full
      debug_api: false

# Client authentication using Supabase JWT
client_auth:
  supabase: true
  supabase_jwt_secret:
    secret_ref: supabase_jwt_secret
  additional_audiences: []
  allow_temporary_tokens: true
