# PowerSync Cloud config - Lumina Church Management
# yaml-language-server: $schema=https://unpkg.com/@powersync/cli-schemas@latest/json-schema/service-config.json
#
# Aligne localement sur service-fetched.yaml (dump Cloud = source de vérité du
# service config, le seul en production). Ce fichier EST le service config Cloud.
# Le deploy service-config ci-dessous renvoie exactement ce contenu (idempotent),
# mais l'URI locale est désormais correcte (Supabase hhgovvrnalibhgpakswi,
# pas l'ancien vvcdmqpbwfyhkzalwdli) et ne duplique plus le mot de passe :
# le mot de passe Supabase est géré par le vault Cloud via `secret_ref`.
#
# ⚠️ Instance = 6a9dd96302481fb31b945823 (cli.yaml), nom "Production", région eu.

_type: cloud
name: Production
region: eu

# Replication connection to Supabase
replication:
  connections:
    - type: postgresql
      uri: postgresql://postgres@db.hhgovvrnalibhgpakswi.supabase.co:5432/postgres
      password:
        secret_ref: default_password
      hostname: db.hhgovvrnalibhgpakswi.supabase.co
      port: 5432
      database: postgres
      username: postgres
      name: Default
      tag: default
      sslmode: verify-full
      debug_api: false

# Client authentication using Supabase JWT
client_auth:
  supabase: true
  supabase_jwt_secret:
    secret_ref: supabase_jwt_secret
  additional_audiences: []
  allow_temporary_tokens: true
